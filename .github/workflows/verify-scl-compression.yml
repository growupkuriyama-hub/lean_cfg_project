name: Verify #3 SCL Compression

on:
  push:
    branches:
      - scl-compression-verification
    paths:
      - "LeanCfgProject/SCLCompression/**"
      - ".github/workflows/verify-scl-compression.yml"
  workflow_dispatch:

concurrency:
  group: scl-compression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-scl-compression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean only for #3 targets
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Build Safety Interface kernel
        run: lake build LeanCfgProject.SCLCompression.SafetyInterface

      - name: Build fixed-order tuple contexts
        run: lake build LeanCfgProject.SCLCompression.TupleContexts

      - name: Build finite syntactic profiles
        run: lake build LeanCfgProject.SCLCompression.FiniteProfiles

      - name: Build syntactic lifting and equalizing-context layer
        run: lake build LeanCfgProject.SCLCompression.SyntacticLifting

      - name: Build relational-morphism kernel
        run: lake build LeanCfgProject.SCLCompression.RelationalMorphisms

      - name: Build compatible-tolerance overlap interface
        run: lake build LeanCfgProject.SCLCompression.CompatibleTolerance

      - name: Build free-monoid selector
        run: lake build LeanCfgProject.SCLCompression.Selector

      - name: Build canonical relational morphism
        run: lake build LeanCfgProject.SCLCompression.CanonicalRelation

      - name: Build regular Safety Interface
        run: lake build LeanCfgProject.SCLCompression.SafetyInterfaceRegular

      - name: Build completely-regular local kernel
        run: lake build LeanCfgProject.SCLCompression.CompletelyRegularKernel

      - name: Build relational-characterization kernel
        run: lake build LeanCfgProject.SCLCompression.RelationalCharacterizationKernel

      - name: Reject proof placeholders in #3 sources
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(sorry|admit)\b' LeanCfgProject/SCLCompression --include='*.lean'; then
            echo "Found a proof placeholder in #3 SCL-Compression Lean sources."
            exit 1
          fi

name: Verify fixed-h TCS v44 Lean formalization

on:
  push:
    branches:
      - tcs-v44-verification
    paths:
      - "LeanCfgProject/FixedHCFGv44/**"
      - ".github/workflows/verify-fixed-h-tcs-v44.yml"
  workflow_dispatch:

concurrency:
  group: fixed-h-v44-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-fixed-h-v44:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Build newest v44 complexity target
        run: lake build LeanCfgProject.FixedHCFGv44.ComplexityBounds

      - name: Build v44 linear witness bounds
        run: lake build LeanCfgProject.FixedHCFGv44.LinearWitnessBounds

      - name: Build v44 characteristic-data bounds
        run: lake build LeanCfgProject.FixedHCFGv44.CharacteristicDataBounds

      - name: Build canonical v44 reconstruction target
        run: lake build LeanCfgProject.FixedHCFGv44.CanonicalReconstruction

      - name: Build canonical v44 witness target
        run: lake build LeanCfgProject.FixedHCFGv44.CanonicalWitness

      - name: Build v44 end-to-end witness bridge
        run: lake build LeanCfgProject.FixedHCFGv44.WitnessEndToEnd

      - name: Build v44 witness-extraction target
        run: lake build LeanCfgProject.FixedHCFGv44.WitnessExtraction

      - name: Build v44 sample-consistency target
        run: lake build LeanCfgProject.FixedHCFGv44.SampleConsistency

      - name: Build v44 soundness target
        run: lake build LeanCfgProject.FixedHCFGv44.Soundness

      - name: Build v44 yield-only typed core
        run: lake build LeanCfgProject.FixedHCFGv44.YieldTypedCore

      - name: Build v44 reduced yield-typed refinement
        run: lake build LeanCfgProject.FixedHCFGv44.YieldTypedTrimmed

      - name: Build v44 finite-witness reconstruction target
        run: lake build LeanCfgProject.FixedHCFGv44.Reconstruction

      - name: Build v44 conservative Gold-learning target
        run: lake build LeanCfgProject.FixedHCFGv44.ConservativeLearning

      - name: Reject proof placeholders in v44 Lean sources
        shell: bash
        run: |
          set -euo pipefail
          if find LeanCfgProject/FixedHCFGv44 -name '*.lean' -print0 | xargs -0 grep -n -E '\b(sorry|admit)\b'; then
            echo "Found a proof placeholder in LeanCfgProject/FixedHCFGv44 Lean sources."
            exit 1
          fi

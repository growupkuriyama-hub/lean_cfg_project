name: Verify TCS v49 linear normalization

on:
  push:
    branches:
      - tcs-v49-verification
    paths:
      - "LeanCfgProject/FixedHCFGv44/LinearNormalization*V49.lean"
      - "LeanCfgProject/FixedHCFGv44/LinearRetainedCardBridgeV49.lean"
      - "LeanCfgProject/FixedHCFGv44/LinearPreprocessing*V49.lean"
      - "LeanCfgProject/FixedHCFGv44/Untyped*V49.lean"
      - ".github/workflows/verify-linear-normalization-v49.yml"
  workflow_dispatch:

concurrency:
  group: tcs-v49-linear-normalization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linear-normalization-v49:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Build manuscript-facing linear normalization package
        shell: bash
        run: |
          set -o pipefail
          lake build LeanCfgProject.FixedHCFGv44.LinearNormalizationManuscriptV49 2>&1 | tee linear-normalization-manuscript-v49-build.log

      - name: Build typed linear-spine bridge from normalized grammar
        shell: bash
        run: |
          set -o pipefail
          lake build LeanCfgProject.FixedHCFGv44.LinearNormalizationTypedShapeV49 2>&1 | tee linear-normalization-typed-shape-v49-build.log

      - name: Build retained-state finite witness bridge
        shell: bash
        run: |
          set -o pipefail
          lake build LeanCfgProject.FixedHCFGv44.LinearRetainedCardBridgeV49 2>&1 | tee linear-retained-card-v49-build.log

      - name: Build end-to-end reduced single-spine normalization package
        shell: bash
        run: |
          set -o pipefail
          lake build LeanCfgProject.FixedHCFGv44.LinearNormalizationEndToEndV49 2>&1 | tee linear-normalization-focused-v49-build.log

      - name: Build source-size polynomial normalization package
        shell: bash
        run: |
          set -o pipefail
          lake build LeanCfgProject.FixedHCFGv44.LinearNormalizationSourceSizeV49 2>&1 | tee linear-normalization-source-size-v49-build.log

      - name: Build source preprocessing and finite prepared enumeration
        shell: bash
        run: |
          set -o pipefail
          lake build LeanCfgProject.FixedHCFGv44.LinearPreprocessingPreparedEnumerationV49 2>&1 | tee linear-preprocessing-v49-build.log

      - name: Upload focused normalization log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linear-normalization-focused-v49-build-log
          path: |
            linear-normalization-manuscript-v49-build.log
            linear-normalization-typed-shape-v49-build.log
            linear-retained-card-v49-build.log
            linear-normalization-focused-v49-build.log
            linear-normalization-source-size-v49-build.log
            linear-preprocessing-v49-build.log

      - name: Reject proof placeholders in normalization layer
        shell: bash
        run: |
          set -euo pipefail
          files=(
            LeanCfgProject/FixedHCFGv44/LinearNormalizationCoreV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationGrammarSizeV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationPreparedSemanticsV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationSSBNFReificationV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationSSBNFExactV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationSSBNFShapeV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationPostPreprocessingV49.lean
            LeanCfgProject/FixedHCFGv44/UntypedTrimmingV49.lean
            LeanCfgProject/FixedHCFGv44/UntypedReducedSSBNFV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationTrimmedV49.lean
            LeanCfgProject/FixedHCFGv44/LinearPreprocessingEpsilonV49.lean
            LeanCfgProject/FixedHCFGv44/LinearPreprocessingUnitV49.lean
            LeanCfgProject/FixedHCFGv44/LinearPreprocessingPreparedBridgeV49.lean
            LeanCfgProject/FixedHCFGv44/LinearPreprocessingPreparedAdequacyV49.lean
            LeanCfgProject/FixedHCFGv44/LinearPreprocessingPreparedEnumerationV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationEndToEndV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationSourceSizeV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationManuscriptV49.lean
            LeanCfgProject/FixedHCFGv44/LinearNormalizationTypedShapeV49.lean
            LeanCfgProject/FixedHCFGv44/LinearRetainedCardBridgeV49.lean
          )
          if grep -n -E '\b(sorry|admit)\b' "${files[@]}"; then
            echo "Found a proof placeholder in v49 linear-normalization sources."
            exit 1
          fi

name: MCFG2 Full Recheck

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcfg2-full-recheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-all-mcfg2:
    name: Rebuild every MCFG2 Lean source
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Remove cached MCFG2 build products
        shell: bash
        run: |
          set -euo pipefail

          # Retain downloaded packages/Mathlib, but force all normal MCFG2
          # modules to be rebuilt in this job.
          rm -rf .lake/build/lib/lean/LeanCfgProject/MCFG2
          rm -rf .lake/build/ir/LeanCfgProject/MCFG2

      - name: Prepare complete MCFG2 source manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts

          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path("LeanCfgProject/MCFG2")
          artifact_dir = Path("ci-artifacts")

          if not root.is_dir():
              raise SystemExit(f"Directory not found: {root}")

          files = sorted(root.rglob("*.lean"))
          if not files:
              raise SystemExit(f"No Lean files found under {root}")

          # Lean module path components must be identifiers.  This intentionally
          # rejects backup names such as Foo(1).lean.
          component_pattern = re.compile(r"^[A-Za-z_][A-Za-z0-9_']*$")
          numbered_copy_pattern = re.compile(r"^(?P<base>.+)\((?P<number>[0-9]+)\)\.lean$")

          valid_targets: list[str] = []
          valid_files: list[str] = []
          duplicate_aliases: list[dict[str, str]] = []
          invalid_files: list[str] = []

          for file in files:
              module_parts = file.with_suffix("").parts
              if all(component_pattern.fullmatch(part) for part in module_parts):
                  valid_targets.append(".".join(module_parts))
                  valid_files.append(file.as_posix())
                  continue

              match = numbered_copy_pattern.fullmatch(file.name)
              if match is None:
                  invalid_files.append(
                      f"{file}: invalid Lean module filename and not a numbered copy"
                  )
                  continue

              canonical = file.with_name(match.group("base") + ".lean")
              if not canonical.is_file():
                  invalid_files.append(
                      f"{file}: numbered copy has no canonical sibling {canonical}"
                  )
                  continue

              file_bytes = file.read_bytes()
              canonical_bytes = canonical.read_bytes()
              if file_bytes != canonical_bytes:
                  invalid_files.append(
                      f"{file}: differs from canonical sibling {canonical}"
                  )
                  continue

              duplicate_aliases.append(
                  {
                      "duplicate": file.as_posix(),
                      "canonical": canonical.as_posix(),
                      "sha256": hashlib.sha256(file_bytes).hexdigest(),
                  }
              )

          if invalid_files:
              print("Invalid MCFG2 source files:", flush=True)
              for item in invalid_files:
                  print(f"  - {item}", flush=True)
              raise SystemExit(2)

          (artifact_dir / "mcfg2-targets.txt").write_text(
              "".join(f"{target}\n" for target in valid_targets),
              encoding="utf-8",
          )
          (artifact_dir / "mcfg2-valid-files.txt").write_text(
              "".join(f"{file}\n" for file in valid_files),
              encoding="utf-8",
          )
          (artifact_dir / "mcfg2-duplicate-aliases.json").write_text(
              json.dumps(duplicate_aliases, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          summary = {
              "source_files": len(files),
              "root_targets": len(valid_targets),
              "exact_duplicate_aliases": len(duplicate_aliases),
              "accounted_files": len(valid_targets) + len(duplicate_aliases),
          }
          (artifact_dir / "mcfg2-manifest-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )

          if summary["accounted_files"] != summary["source_files"]:
              raise SystemExit(
                  "Internal manifest error: not every source file was accounted for"
              )

          github_output = Path(__import__("os").environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as output:
              for key, value in summary.items():
                  output.write(f"{key}={value}\n")

          print(
              "MCFG2 manifest: "
              f"{summary['source_files']} source files; "
              f"{summary['root_targets']} normal module targets; "
              f"{summary['exact_duplicate_aliases']} exact duplicate aliases."
          )

          for alias in duplicate_aliases:
              print(
                  "Exact duplicate alias: "
                  f"{alias['duplicate']} == {alias['canonical']} "
                  f"(SHA-256 {alias['sha256']})"
              )
          PY

      - name: Build every normal MCFG2 module
        id: mcfg2_full_recheck
        shell: bash
        run: |
          set -uo pipefail

          artifact_dir="ci-artifacts"
          target_file="${artifact_dir}/mcfg2-targets.txt"
          log_file="${artifact_dir}/mcfg2-full-build.log"

          mapfile -t targets < "$target_file"
          total_targets="${#targets[@]}"

          if (( total_targets == 0 )); then
            echo "::error::The MCFG2 target manifest is empty"
            exit 1
          fi

          echo "Building ${total_targets} normal MCFG2 root modules."
          echo "First target: ${targets[0]}"
          echo "Last target:  ${targets[$((total_targets - 1))]}"

          {
            echo "## MCFG2 full recheck"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Lean source files discovered: **${{ steps.manifest.outputs.source_files }}**"
            echo "- Normal module root targets: **${{ steps.manifest.outputs.root_targets }}**"
            echo "- Exact duplicate aliases: **${{ steps.manifest.outputs.exact_duplicate_aliases }}**"
            echo "- MCFG2 build products removed before this build"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if lake build "${targets[@]}" >"$log_file" 2>&1; then
            echo \
              "MCFG2 FULL RECHECK: PASS " \
              "(${{ steps.manifest.outputs.accounted_files }}/${{ steps.manifest.outputs.source_files }} source files accounted for; " \
              "${total_targets}/${total_targets} normal modules built)"

            {
              echo "### Result: PASS"
              echo
              echo "All **${total_targets}** normal MCFG2 modules built successfully."
              echo
              echo \
                "All **${{ steps.manifest.outputs.source_files }}** source files were accounted for: " \
                "**${{ steps.manifest.outputs.root_targets }}** compiled module sources and " \
                "**${{ steps.manifest.outputs.exact_duplicate_aliases }}** byte-identical numbered-copy aliases."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::MCFG2 FULL RECHECK: FAIL"

          {
            echo "### Result: FAIL"
            echo
            echo "At least one of the **${total_targets}** normal MCFG2 modules failed."
            echo "See the focused diagnostics below and the uploaded complete log."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "----- focused Lean diagnostics -----"

          python3 - "$log_file" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()

          patterns = [
              re.compile(r"^✖"),
              re.compile(r"\berror:", re.I),
              re.compile(r"application type mismatch", re.I),
              re.compile(r"\btype mismatch\b", re.I),
              re.compile(r"unknown (identifier|constant|declaration|target)", re.I),
              re.compile(r"failed to synthesize", re.I),
              re.compile(r"unsolved goals?", re.I),
              re.compile(r"unexpected token", re.I),
              re.compile(
                  r"invalid (field|constructor|declaration|syntax|pattern)",
                  re.I,
              ),
              re.compile(r"declaration uses \.sorry", re.I),
              re.compile(r"declaration has metavariables", re.I),
              re.compile(r"maximum recursion depth", re.I),
              re.compile(r"(deterministic )?timeout", re.I),
          ]

          hits = [
              i
              for i, line in enumerate(lines)
              if any(pattern.search(line) for pattern in patterns)
          ]

          if not hits:
              print("No standard error marker found. Final 250 lines:")
              start = max(0, len(lines) - 250)
              for n in range(start, len(lines)):
                  print(f"{n + 1}: {lines[n]}")
              raise SystemExit(0)

          ranges = []
          for i in hits:
              start = max(0, i - 12)
              end = min(len(lines), i + 55)
              if ranges and start <= ranges[-1][1]:
                  ranges[-1] = (
                      ranges[-1][0],
                      max(ranges[-1][1], end),
                  )
              else:
                  ranges.append((start, end))

          max_ranges = 20
          for start, end in ranges[:max_ranges]:
              for n in range(start, end):
                  print(f"{n + 1}: {lines[n]}")
              print("---")

          if len(ranges) > max_ranges:
              print(
                  f"Focused output truncated: "
                  f"{len(ranges) - max_ranges} additional diagnostic ranges "
                  f"remain in the uploaded complete log."
              )
          PY

          echo "----- end focused diagnostics -----"
          exit 1

      - name: Upload complete failure log and manifest
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcfg2-full-recheck-${{ github.run_number }}
          path: |
            ci-artifacts/mcfg2-full-build.log
            ci-artifacts/mcfg2-targets.txt
            ci-artifacts/mcfg2-valid-files.txt
            ci-artifacts/mcfg2-duplicate-aliases.json
            ci-artifacts/mcfg2-manifest-summary.json
          if-no-files-found: warn
          retention-days: 14

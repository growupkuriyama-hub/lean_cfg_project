name: ADP - OpenTelemetry V11 experiment

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Independent normal-trace collection runs
        required: true
        default: "5"
        type: string
      seeds:
        description: Run-disjoint evaluation seeds
        required: true
        default: "5"
        type: string
      warmup_seconds:
        description: Warm-up before each collection window
        required: true
        default: "45"
        type: string
      collect_seconds:
        description: Trace collection time per run
        required: true
        default: "90"
        type: string
      demo_ref:
        description: OpenTelemetry Demo branch, tag, or commit
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: opentelemetry-v11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    name: Collect and evaluate traces
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out lean_cfg_project
        uses: actions/checkout@v6

      # runner.temp cannot be evaluated in workflow-level env.
      # RUNNER_TEMP is available after the runner starts, so persist the
      # absolute paths for all later steps through GITHUB_ENV.
      - name: Initialize experiment paths
        shell: bash
        run: |
          set -euxo pipefail
          echo "EXPERIMENT_DIR=$GITHUB_WORKSPACE/LeanCfgProject/adaptive_h_mcfg" >> "$GITHUB_ENV"
          echo "DEMO_DIR=$RUNNER_TEMP/opentelemetry-demo" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$GITHUB_WORKSPACE/mcfg-v11-experiment" >> "$GITHUB_ENV"
          echo "DIAGNOSTICS_DIR=$GITHUB_WORKSPACE/github-actions-diagnostics" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify repository layout
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$EXPERIMENT_DIR"
          test -f "$EXPERIMENT_DIR/pyproject.toml"
          test -f "$EXPERIMENT_DIR/run_v11_end_to_end.py"
          test -f "$EXPERIMENT_DIR/otel_demo/run_normal_v11.py"
          printf 'Experiment directory: %s\n' "$EXPERIMENT_DIR"
          find "$EXPERIMENT_DIR" -maxdepth 2 -type f | sort | sed -n '1,160p'

      - name: Install experiment dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --editable "$EXPERIMENT_DIR"

      - name: Run prototype regression tests
        shell: bash
        working-directory: LeanCfgProject/adaptive_h_mcfg
        run: |
          set -euxo pipefail
          python -m pytest -q

      - name: Show runner resources
        shell: bash
        run: |
          set -euxo pipefail
          python --version
          docker version
          docker compose version
          free -h
          df -h

      - name: Free disk space for OpenTelemetry Demo images
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          docker system prune --all --force || true
          df -h

      - name: Fetch the official OpenTelemetry Demo
        shell: bash
        env:
          DEMO_REF: ${{ inputs.demo_ref }}
        run: |
          set -euxo pipefail
          rm -rf "$DEMO_DIR"
          mkdir -p "$DEMO_DIR"
          git -C "$DEMO_DIR" init
          git -C "$DEMO_DIR" remote add origin https://github.com/open-telemetry/opentelemetry-demo.git
          git -C "$DEMO_DIR" fetch --depth 1 origin "$DEMO_REF"
          git -C "$DEMO_DIR" checkout --detach FETCH_HEAD
          git -C "$DEMO_DIR" rev-parse HEAD | tee "$GITHUB_WORKSPACE/opentelemetry-demo-commit.txt"
          ls -la "$DEMO_DIR"

      - name: Run unmodified Demo collection and V11 evaluation
        shell: bash
        working-directory: LeanCfgProject/adaptive_h_mcfg
        env:
          RUNS: ${{ inputs.runs }}
          SEEDS: ${{ inputs.seeds }}
          WARMUP: ${{ inputs.warmup_seconds }}
          COLLECT: ${{ inputs.collect_seconds }}
        run: |
          set -euxo pipefail
          rm -rf "$OUTPUT_DIR"
          python run_v11_end_to_end.py "$DEMO_DIR" \
            --output "$OUTPUT_DIR" \
            --runs "$RUNS" \
            --seeds "$SEEDS" \
            --warmup-seconds "$WARMUP" \
            --collect-seconds "$COLLECT" \
            --minimal

      - name: Display experiment summary
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          test -f "$OUTPUT_DIR/dataset/validation_report.json"
          test -f "$OUTPUT_DIR/results/summary.json"
          echo '--- validation_report.json ---'
          cat "$OUTPUT_DIR/dataset/validation_report.json"
          echo
          echo '--- aggregate_metrics.csv ---'
          cat "$OUTPUT_DIR/results/aggregate_metrics.csv"
          echo
          echo '--- model_complexity.csv ---'
          cat "$OUTPUT_DIR/results/model_complexity.csv"

      - name: Save runner diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAGNOSTICS_DIR"
          date --iso-8601=seconds > "$DIAGNOSTICS_DIR/date.txt"
          df -h > "$DIAGNOSTICS_DIR/disk.txt"
          free -h > "$DIAGNOSTICS_DIR/memory.txt"
          docker system df > "$DIAGNOSTICS_DIR/docker-disk.txt"
          docker ps -a > "$DIAGNOSTICS_DIR/docker-containers.txt"
          docker images > "$DIAGNOSTICS_DIR/docker-images.txt"
          cp "$GITHUB_WORKSPACE/opentelemetry-demo-commit.txt" "$DIAGNOSTICS_DIR/" 2>/dev/null
          cp "$EXPERIMENT_DIR/pyproject.toml" "$DIAGNOSTICS_DIR/experiment-pyproject.toml" 2>/dev/null
          printf 'experiment_dir=%s\ndemo_dir=%s\noutput_dir=%s\n' \
            "$EXPERIMENT_DIR" "$DEMO_DIR" "$OUTPUT_DIR" \
            > "$DIAGNOSTICS_DIR/paths.txt"

      - name: Upload traces, results, and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcfg-v11-experiment-${{ github.run_id }}
          path: |
            mcfg-v11-experiment
            github-actions-diagnostics
            opentelemetry-demo-commit.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

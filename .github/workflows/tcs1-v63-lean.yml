name: TCS1 v63 Lean CI

concurrency:
  group: tcs1-v63-lean-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - tcs1-v63-lean
  workflow_dispatch:

jobs:
  check-tcs1-v63:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
          lint: false

      - name: Check fixed-h substitutability kernel
        run: lake build LeanCfgProject.TCS1.FixedHSubstitutability

      - name: Check yield-typed refinement core
        run: lake build LeanCfgProject.TCS1.YieldTypedRefinementCore

      - name: Check reconstruction soundness
        run: lake build LeanCfgProject.TCS1.ReconstructionSoundness

      - name: Check canonical-witness completeness
        run: lake build LeanCfgProject.TCS1.CanonicalWitnessCompleteness

      - name: Check conservative Gold kernel
        run: lake build LeanCfgProject.TCS1.ConservativeGoldKernel

      - name: Check witness-set construction
        run: lake build LeanCfgProject.TCS1.WitnessSetConstruction

      - name: Check reducedness witness choices
        run: lake build LeanCfgProject.TCS1.ReducednessWitnessChoices

      - name: Check Section 7 thickness arithmetic
        run: lake build LeanCfgProject.TCS1.SSBNFThicknessBounds

      - name: Check SSBNF normalization combinatorics
        run: lake build LeanCfgProject.TCS1.SSBNFNormalizationCombinatorics

      - name: Check fixed-window characteristic-data bounds
        run: lake build LeanCfgProject.TCS1.FixedWindowCharacteristicDataBounds

      - name: Check fixed-window tree combinatorics
        run: lake build LeanCfgProject.TCS1.FixedWindowTreeCombinatorics

      - name: Check normalization language-bound transfer
        run: lake build LeanCfgProject.TCS1.NormalizationLanguageBounds

      - name: Check Gold convergence closure
        run: lake build LeanCfgProject.TCS1.GoldConvergenceClosure

      - name: Reject sorry in TCS1
        run: |
          if grep -R -nE '\bsorry\b' LeanCfgProject/TCS1 --include="*.lean"; then
            echo "::error::sorry found in TCS1 Lean files"
            exit 1
          fi

      - name: Reject project-level axiom in TCS1
        run: |
          if grep -R -nE '^[[:space:]]*axiom\b' LeanCfgProject/TCS1 --include="*.lean"; then
            echo "::error::axiom found in TCS1 Lean files"
            exit 1
          fi

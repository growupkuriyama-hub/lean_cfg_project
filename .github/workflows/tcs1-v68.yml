name: TCS1 v68 Lean

on:
  pull_request:
    branches:
      - tcs1-v68-ci-anchor*
    paths:
      - "LeanCfgProject/TCS1/**"
      - ".github/workflows/tcs1-v68.yml"
      - "lakefile.toml"
      - "lean-toolchain"
      - "lake-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcs1-v68-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build TCS1 v68 facade
        uses: leanprover/lean-action@v1
        with:
          build-args: "LeanCfgProject/TCS1/All.lean:o"

      - name: Reject sorry in TCS1
        run: |
          if grep -R -nE '\\bsorry\\b' LeanCfgProject/TCS1 --include="*.lean"; then
            echo "::error::sorry found in TCS1 Lean files"
            exit 1
          fi

      - name: Reject project-level axiom in TCS1
        run: |
          if grep -R -nE '^[[:space:]]*axiom\\b' LeanCfgProject/TCS1 --include="*.lean"; then
            echo "::error::axiom found in TCS1 Lean files"
            exit 1
          fi

          mkdir -p "$PART_ROOT/upload/fanout-$FANOUT"
          cp -a "$PART_ROOT/final/." "$PART_ROOT/upload/fanout-$FANOUT/"
          cp "$GITHUB_WORKSPACE/v15-2-merged-files-f${FANOUT}.txt" "$PART_ROOT/upload/fanout-$FANOUT/"

      - name: Upload fan-out result
        uses: actions/upload-artifact@v7
        with:
          name: adp-mcfg-v15-2-fanout-${{ matrix.fanout }}-${{ github.run_id }}
          path: v15-2-parts-f${{ matrix.fanout }}/upload
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: adp-mcfg-v15-2-fanout-${{ matrix.fanout }}-diagnostics-${{ github.run_id }}
          path: |
            v15-2-parts-f${{ matrix.fanout }}
            v15-2-merged-files-f${{ matrix.fanout }}.txt
          if-no-files-found: warn
          retention-days: 14

  consolidate:
    name: Consolidate V15.2 manuscript artifact
    needs: fanout_audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download all fan-out artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: adp-mcfg-v15-2-fanout-*-${{ github.run_id }}
          path: v15-download
          merge-multiple: true

      - name: Consolidate and validate
        shell: bash
        run: |
          set -euxo pipefail
          find v15-download -maxdepth 3 -type f | sort
          python LeanCfgProject/adaptive_h_mcfg3/consolidate_v15_fanouts.py \
            --input-root v15-download \
            --output adp-mcfg-v15-2-controlled-independent
          python - <<'PY'
          import json
          summary = json.load(open("adp-mcfg-v15-2-controlled-independent/summary.json", encoding="utf-8"))
          assert summary["ready_for_manuscript"] is True, summary
          print(json.dumps(summary["selected_by_fanout"], indent=2))
          PY

      - name: Upload consolidated V15.2 result
        uses: actions/upload-artifact@v7
        with:
          name: adp-mcfg-v15-2-controlled-independent-${{ github.run_id }}
          path: adp-mcfg-v15-2-controlled-independent
          if-no-files-found: error
          retention-days: 30

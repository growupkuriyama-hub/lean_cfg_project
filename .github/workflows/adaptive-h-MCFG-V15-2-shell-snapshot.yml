      - name: Aggregate Adaptive results
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$PART_ROOT/configurations/adaptive"
          cd "$EXPERIMENT_DIR"
          python -u aggregate_v15_snapshot_shards.py \
            --snapshot-dir "$PART_ROOT/snapshots/adaptive" \
            --shards-root "$PART_ROOT/shards/adaptive" \
            --output "$PART_ROOT/configurations/adaptive" \
            --min-test-count 4 \
            --max-test-count "$MAX_TEST_COUNT" \
            --max-values-per-nt "$MAX_VALUES_PER_NT" \
            --max-total-values "$MAX_TOTAL_VALUES"


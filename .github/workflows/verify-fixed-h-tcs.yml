name: Verify fixed-h TCS Lean formalization

on:
  push:
    branches:
      - tcs-fixed-h-verification
    paths:
      - "LeanCfgProject/FixedHCFG/**"
      - ".github/workflows/verify-fixed-h-tcs.yml"
  workflow_dispatch:

concurrency:
  group: fixed-h-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-fixed-h-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Build exact v60 nonempty-factor kernel
        run: lake build LeanCfgProject.FixedHCFG.V60Kernel

      - name: Build exact v60 yield-only typed refinement
        run: lake build LeanCfgProject.FixedHCFG.V60TypedRefinement

      - name: Build exact v60 trimmed yield-only refinement
        run: lake build LeanCfgProject.FixedHCFG.V60TrimmedRefinement

      - name: Build v60 extraction bridge
        run: lake build LeanCfgProject.FixedHCFG.V60Extraction

      - name: Build exact v60 canonical choices
        run: lake build LeanCfgProject.FixedHCFG.V60CanonicalChoices

      - name: Build exact v60 canonical reconstruction basis
        run: lake build LeanCfgProject.FixedHCFG.V60CanonicalBasis

      - name: Build exact v60 yield-only reconstruction
        run: lake build LeanCfgProject.FixedHCFG.V60Reconstruction

      - name: Build exact v60 conservative identification
        run: lake build LeanCfgProject.FixedHCFG.V60Identification

      - name: Build exact v60 Gold convergence
        run: lake build LeanCfgProject.FixedHCFG.V60Gold

      - name: Build exact v60 end-to-end theorem
        run: lake build LeanCfgProject.FixedHCFG.V60EndToEnd

      - name: Build legacy Theorem 5.6 soundness target
        run: lake build LeanCfgProject.FixedHCFG.Soundness

      - name: Build legacy Section 4 typed-refinement target
        run: lake build LeanCfgProject.FixedHCFG.TypedRefinement

      - name: Build legacy trimmed-language target
        run: lake build LeanCfgProject.FixedHCFG.TrimmedLanguage

      - name: Build legacy canonical-witness target
        run: lake build LeanCfgProject.FixedHCFG.CanonicalWitness

      - name: Build legacy reconstruction target
        run: lake build LeanCfgProject.FixedHCFG.Reconstruction

      - name: Build legacy identification target
        run: lake build LeanCfgProject.FixedHCFG.Identification

      - name: Build conservative compatibility target
        run: lake build LeanCfgProject.FixedHCFG.ConservativeIdentification

      - name: Build enriched Section 4 extraction bridge
        run: lake build LeanCfgProject.FixedHCFG.EnrichedExtraction

      - name: Build end-to-end SSBNF identification bridge
        run: lake build LeanCfgProject.FixedHCFG.EndToEnd

      - name: Build shortlex canonical witness target
        run: lake build LeanCfgProject.FixedHCFG.ShortlexWitness

      - name: Build exact manuscript characteristic-sample target
        run: lake build LeanCfgProject.FixedHCFG.PaperCharacteristicSample

      - name: Build Section 6 complexity-envelope target
        run: lake build LeanCfgProject.FixedHCFG.ComplexityBounds

      - name: Build Section 7 linear sample-bound target
        run: lake build LeanCfgProject.FixedHCFG.LinearBounds

      - name: Build Lemma 7.3 strict-linear spine target
        run: lake build LeanCfgProject.FixedHCFG.LinearSpine

      - name: Build derivation-level Lemmas 7.3--7.6 target
        run: lake build LeanCfgProject.FixedHCFG.LinearDerivation

      - name: Build aggregate fixed-h summary target
        run: lake build LeanCfgProject.FixedHCFG.Summary

      - name: Reject proof placeholders in fixed-h Lean sources
        shell: bash
        run: |
          set -euo pipefail
          if find LeanCfgProject/FixedHCFG -name '*.lean' -print0 | xargs -0 grep -n -E '\b(sorry|admit)\b'; then
            echo "Found a proof placeholder in LeanCfgProject/FixedHCFG Lean sources."
            exit 1
          fi

name: Verify fixed-h TCS Lean formalization

on:
  push:
    branches:
      - tcs-fixed-h-verification
    paths:
      - "LeanCfgProject/FixedHCFG/**"
      - ".github/workflows/verify-fixed-h-tcs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fixed-h-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Build Theorem 5.6 soundness target
        run: lake build LeanCfgProject.FixedHCFG.Soundness

      - name: Build Section 4 typed-refinement target
        run: lake build LeanCfgProject.FixedHCFG.TypedRefinement

      - name: Build Lemma 4.5(iii) trimmed-language target
        run: lake build LeanCfgProject.FixedHCFG.TrimmedLanguage

      - name: Build Lemma 4.6 canonical-witness target
        run: lake build LeanCfgProject.FixedHCFG.CanonicalWitness

      - name: Build Theorems 5.2--5.7 reconstruction target
        run: lake build LeanCfgProject.FixedHCFG.Reconstruction

      - name: Build Corollary 5.8 identification target
        run: lake build LeanCfgProject.FixedHCFG.Identification

      - name: Build enriched Section 4 extraction bridge
        run: lake build LeanCfgProject.FixedHCFG.EnrichedExtraction

      - name: Build end-to-end SSBNF identification bridge
        run: lake build LeanCfgProject.FixedHCFG.EndToEnd

      - name: Build shortlex canonical witness target
        run: lake build LeanCfgProject.FixedHCFG.ShortlexWitness

      - name: Build exact manuscript characteristic-sample target
        run: lake build LeanCfgProject.FixedHCFG.PaperCharacteristicSample

      - name: Build aggregate fixed-h summary target
        run: lake build LeanCfgProject.FixedHCFG.Summary

      - name: Reject proof placeholders in fixed-h Lean sources
        shell: bash
        run: |
          set -euo pipefail
          if find LeanCfgProject/FixedHCFG -name '*.lean' -print0 | xargs -0 grep -n -E '\b(sorry|admit)\b'; then
            echo "Found a proof placeholder in LeanCfgProject/FixedHCFG Lean sources."
            exit 1
          fi

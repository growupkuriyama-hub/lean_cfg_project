name: Verify fixed-h TCS Section 7

on:
  push:
    branches:
      - tcs-fixed-h-verification
    paths:
      - "LeanCfgProject/FixedHCFG/LinearBounds.lean"
      - "LeanCfgProject/FixedHCFG/LinearSpine.lean"
      - "LeanCfgProject/FixedHCFG/LinearDerivation.lean"
      - "LeanCfgProject/FixedHCFG/LinearShortlex.lean"
      - "LeanCfgProject/FixedHCFG/LinearTypedRefinement.lean"
      - "LeanCfgProject/FixedHCFG/LinearRuleSlots.lean"
      - "LeanCfgProject/FixedHCFG/LinearTrimmed.lean"
      - "LeanCfgProject/FixedHCFG/LinearLanguage.lean"
      - "LeanCfgProject/FixedHCFG/LinearCanonical.lean"
      - "LeanCfgProject/FixedHCFG/LinearReconstruction.lean"
      - "LeanCfgProject/FixedHCFG/LinearBasisExtraction.lean"
      - "LeanCfgProject/FixedHCFG/LinearTimeData.lean"
      - "LeanCfgProject/FixedHCFG/LinearActualTimeData.lean"
      - "LeanCfgProject/FixedHCFG/LinearActualSample.lean"
      - "LeanCfgProject/FixedHCFG/LinearActualSampleFinite.lean"
      - "LeanCfgProject/FixedHCFG/LinearActualSampleExact.lean"
      - "LeanCfgProject/FixedHCFG/LinearActualSampleRepresentation.lean"
      - ".github/workflows/verify-fixed-h-section7.yml"
  workflow_dispatch:

concurrency:
  group: fixed-h-section7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-section7:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1

      - name: Build exact characteristic-sample representation
        run: lake build LeanCfgProject.FixedHCFG.LinearActualSampleRepresentation

      - name: Build exact actual sample specifications
        run: lake build LeanCfgProject.FixedHCFG.LinearActualSampleExact

      - name: Build exact finite actual sample target
        run: lake build LeanCfgProject.FixedHCFG.LinearActualSampleFinite

      - name: Build actual realised-sample target
        run: lake build LeanCfgProject.FixedHCFG.LinearActualSample

      - name: Build actual typed-linear Theorem 7.9 specialization
        run: lake build LeanCfgProject.FixedHCFG.LinearActualTimeData

      - name: Build actual typed-linear reconstruction-basis extraction
        run: lake build LeanCfgProject.FixedHCFG.LinearBasisExtraction

      - name: Build Lemma 7.8 exact reconstruction
        run: lake build LeanCfgProject.FixedHCFG.LinearReconstruction

      - name: Build Theorem 7.9 polynomial time-and-data envelope
        run: lake build LeanCfgProject.FixedHCFG.LinearTimeData

      - name: Build canonical shortlex witnesses on the reduced linear grammar
        run: lake build LeanCfgProject.FixedHCFG.LinearCanonical

      - name: Build strict-linear language and trimming semantics bridge
        run: lake build LeanCfgProject.FixedHCFG.LinearLanguage

      - name: Build strict-linear reachable/productive trimming bridge
        run: lake build LeanCfgProject.FixedHCFG.LinearTrimmed

      - name: Build Proposition 7.7(ii) rule-slot bound
        run: lake build LeanCfgProject.FixedHCFG.LinearRuleSlots

      - name: Build actual typed-linear refinement bridge
        run: lake build LeanCfgProject.FixedHCFG.LinearTypedRefinement

      - name: Build manuscript shortlex bridge for Lemmas 7.5--7.6
        run: lake build LeanCfgProject.FixedHCFG.LinearShortlex

      - name: Build derivation-level Lemmas 7.3--7.6
        run: lake build LeanCfgProject.FixedHCFG.LinearDerivation

      - name: Build strict-linear spine deletion
        run: lake build LeanCfgProject.FixedHCFG.LinearSpine

      - name: Build Section 7 finite bounds
        run: lake build LeanCfgProject.FixedHCFG.LinearBounds

      - name: Reject proof placeholders in Section 7 sources
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -E '\b(sorry|admit)\b' \
            LeanCfgProject/FixedHCFG/LinearBounds.lean \
            LeanCfgProject/FixedHCFG/LinearSpine.lean \
            LeanCfgProject/FixedHCFG/LinearDerivation.lean \
            LeanCfgProject/FixedHCFG/LinearShortlex.lean \
            LeanCfgProject/FixedHCFG/LinearTypedRefinement.lean \
            LeanCfgProject/FixedHCFG/LinearRuleSlots.lean \
            LeanCfgProject/FixedHCFG/LinearTrimmed.lean \
            LeanCfgProject/FixedHCFG/LinearLanguage.lean \
            LeanCfgProject/FixedHCFG/LinearCanonical.lean \
            LeanCfgProject/FixedHCFG/LinearReconstruction.lean \
            LeanCfgProject/FixedHCFG/LinearBasisExtraction.lean \
            LeanCfgProject/FixedHCFG/LinearTimeData.lean \
            LeanCfgProject/FixedHCFG/LinearActualTimeData.lean \
            LeanCfgProject/FixedHCFG/LinearActualSample.lean \
            LeanCfgProject/FixedHCFG/LinearActualSampleFinite.lean \
            LeanCfgProject/FixedHCFG/LinearActualSampleExact.lean \
            LeanCfgProject/FixedHCFG/LinearActualSampleRepresentation.lean; then
            echo "Found a proof placeholder in Section 7 Lean sources."
            exit 1
          fi

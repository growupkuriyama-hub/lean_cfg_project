name: MCFG2 Successful Experiments Regression v2

on:
  workflow_dispatch:
  push:
    paths:
      - "LeanCfgProject/MCFG2/**"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/MCFG2_successful_experiments_regression_v2.yml"

permissions:
  contents: read

concurrency:
  group: mcfg2-successful-experiments-${{ github.ref }}
  cancel-in-progress: true

env:
  MCFG2_SUCCESS_VERSION: "v2-210-directly-confirmed-through-run-30628272441"
  MCFG2_ROOT: LeanCfgProject/MCFG2
  MCFG2_SUCCESS_COUNT: "210"
  MCFG2_TOTAL_SNAPSHOT_COUNT: "303"
  MCFG2_UNVERIFIED_COUNT: "93"
  MCFG2_SUCCESS_SHARDS: "12"

jobs:
  prepare:

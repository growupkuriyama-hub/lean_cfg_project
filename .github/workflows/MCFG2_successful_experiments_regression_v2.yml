          EOF_TARGETS

          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["MCFG2_ROOT"])
          manifest = Path("ci-artifacts/manifest/successful-targets.txt")
          expected_success = int(os.environ["MCFG2_SUCCESS_COUNT"])
          expected_total = int(os.environ["MCFG2_TOTAL_SNAPSHOT_COUNT"])
          expected_unverified = int(os.environ["MCFG2_UNVERIFIED_COUNT"])
          requested_shards = int(os.environ["MCFG2_SUCCESS_SHARDS"])

          if not root.is_dir():
              raise SystemExit(f"Directory not found: {root}")

          successful = [
              line.strip()
              for line in manifest.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          if len(successful) != expected_success:
              raise SystemExit(
                  f"Successful-root manifest has {len(successful)} entries; "
                  f"expected {expected_success}"
              )
          if len(set(successful)) != len(successful):
              raise SystemExit("Duplicate module in successful-root manifest")

          component = re.compile(r"^[A-Za-z_][A-Za-z0-9_']*$")
          source_targets: list[str] = []
          invalid_files: list[str] = []
          for file in sorted(root.rglob("*.lean")):
              parts = file.with_suffix("").parts
              if all(component.fullmatch(part) for part in parts):
                  source_targets.append(".".join(parts))
              else:
                  invalid_files.append(file.as_posix())

          if invalid_files:
              raise SystemExit(
                  "Invalid Lean module filenames:\n" +
                  "\n".join(f"  - {item}" for item in invalid_files)
              )
          if len(source_targets) != expected_total:
              raise SystemExit(
                  f"Current MCFG2 tree has {len(source_targets)} valid modules; "
                  f"this fixed snapshot expects {expected_total}. "
                  "Update the success manifest intentionally before proceeding."
              )

          current = set(source_targets)
          listed = set(successful)
          missing = sorted(listed - current)
          if missing:
              raise SystemExit(
                  "Confirmed-success modules missing from repository:\n" +
                  "\n".join(f"  - {item}" for item in missing)
              )

          unverified = sorted(current - listed)
          if len(unverified) != expected_unverified:
              raise SystemExit(
                  f"Unverified complement has {len(unverified)} modules; "
                  f"expected {expected_unverified}"
              )

          Path("ci-artifacts/manifest/unverified-targets.txt").write_text(
              "".join(f"{target}\n" for target in unverified),
              encoding="utf-8",
          )
          Path("ci-artifacts/manifest/all-current-targets.txt").write_text(
              "".join(f"{target}\n" for target in source_targets),
              encoding="utf-8",
          )

          shard_count = min(max(1, requested_shards), len(successful))
          matrix = list(range(shard_count))
          summary = {
              "version": os.environ["MCFG2_SUCCESS_VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "confirmed_success_targets": len(successful),
              "unverified_targets": len(unverified),
              "total_snapshot_targets": len(source_targets),
              "shard_count": shard_count,
          }
          Path("ci-artifacts/manifest/summary.json").write_text(
              json.dumps(summary, indent=2) + "\n",
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              out.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              out.write(f"shard_count={shard_count}\n")
              out.write(f"success_count={len(successful)}\n")

          print(
              f"Validated {len(successful)} confirmed-success roots and "
              f"excluded {len(unverified)} unverified roots."
          )
          PY

      - name: Upload successful-root manifest
        uses: actions/upload-artifact@v7
        with:
          name: mcfg2-success-v2-manifest
          path: ci-artifacts/manifest
          if-no-files-found: error
          retention-days: 30

  regression:
    name: Successful roots shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Download successful-root manifest
        uses: actions/download-artifact@v7
        with:
          name: mcfg2-success-v2-manifest
          path: ci-input/manifest

      - name: Rebuild every assigned successful root separately
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
        run: |
          set -euo pipefail

          echo "Regression version: ${MCFG2_SUCCESS_VERSION}"
          echo "Commit: ${GITHUB_SHA}"

          # Do not trust restored project products. Dependencies built earlier
          # in this shard may be reused, but every listed root is forced to
          # elaborate again before its result is recorded.
          rm -rf .lake/build/lib/lean/LeanCfgProject/MCFG2
          rm -rf .lake/build/ir/LeanCfgProject/MCFG2

          shard_dir="ci-artifacts/shard-${SHARD}"
          log_dir="${shard_dir}/logs"
          focused_dir="${shard_dir}/focused"
          mkdir -p "$log_dir" "$focused_dir"
          : > "${shard_dir}/results.tsv"
          : > "${shard_dir}/failures.txt"

          python3 - "$SHARD" "$SHARD_COUNT" <<'PY' > "${shard_dir}/targets.txt"
          from pathlib import Path
          import sys

          shard = int(sys.argv[1])
          shard_count = int(sys.argv[2])
          targets = [
              line.strip()
              for line in Path("ci-input/manifest/successful-targets.txt")
                  .read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          for index, target in enumerate(targets):
              if index % shard_count == shard:
                  print(target)
          PY

          target_count=$(wc -l < "${shard_dir}/targets.txt")
          echo "Shard ${SHARD}/${SHARD_COUNT}: ${target_count} confirmed-success roots"

          while IFS= read -r target; do
            [[ -n "$target" ]] || continue

            module_path="${target//./\/}"
            safe_name="${target//./_}"
            log_file="${log_dir}/${safe_name}.log"

            rm -f \
              ".lake/build/lib/lean/${module_path}.olean" \
              ".lake/build/lib/lean/${module_path}.ilean" \
              ".lake/build/lib/lean/${module_path}.olean.hash" \
              ".lake/build/lib/lean/${module_path}.trace" \
              ".lake/build/ir/${module_path}.c" \
              ".lake/build/ir/${module_path}.o" \
              ".lake/build/ir/${module_path}.setup.json"

            started=$(date +%s)
            set +e
            lake build "$target" >"$log_file" 2>&1
            status=$?
            set -e
            elapsed=$(( $(date +%s) - started ))

            if (( status == 0 )); then
              printf 'PASS\t%s\t%s\n' "$elapsed" "$target" \
                >> "${shard_dir}/results.tsv"
              echo "PASS (${elapsed}s): $target"
            else
              printf 'FAIL\t%s\t%s\n' "$elapsed" "$target" \
                >> "${shard_dir}/results.tsv"
              printf '%s\n' "$target" >> "${shard_dir}/failures.txt"
              echo "::error title=Confirmed MCFG2 regression::$target"
              echo "FAIL (${elapsed}s): $target"

              focused_file="${focused_dir}/${safe_name}.txt"
              python3 - "$target" "$log_file" "$focused_file" <<'PY'
          from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          target, log_name, output_name = sys.argv[1:]
          lines = Path(log_name).read_text(errors="replace").splitlines()
          diagnostic = re.compile(
              r"(?:^|[^A-Za-z])error:|unsolved goals?|"
              r"application type mismatch|type mismatch|"
              r"unknown (?:identifier|constant|declaration|target)|"
              r"failed to synthesize|unexpected token|"
              r"invalid (?:field|constructor|declaration|syntax|pattern|argument name)|"
              r"maximum recursion depth|timeout",
              re.IGNORECASE,
          )
          hits = [i for i, line in enumerate(lines) if diagnostic.search(line)]
          ranges: list[tuple[int, int]] = []
          for index in hits[:20]:
              start = max(0, index - 5)
              end = min(len(lines), index + 60)
              if ranges and start <= ranges[-1][1] + 1:
                  ranges[-1] = (ranges[-1][0], max(ranges[-1][1], end))
              else:
                  ranges.append((start, end))
          if not ranges:
              ranges = [(max(0, len(lines) - 180), len(lines))]

          output = [f"===== TARGET: {target} =====", f"LOG: {log_name}", ""]
          for number, (start, end) in enumerate(ranges, 1):
              output.append(f"--- range {number}: lines {start + 1}-{end} ---")
              output.extend(
                  f"{line_number + 1}: {lines[line_number]}"
                  for line_number in range(start, end)
              )
              output.append("")
          Path(output_name).write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
              cat "$focused_file"
            fi
          done < "${shard_dir}/targets.txt"

          pass_count=$(awk -F '\t' '$1 == "PASS" {n++} END {print n+0}' \
            "${shard_dir}/results.tsv")
          fail_count=$(awk -F '\t' '$1 == "FAIL" {n++} END {print n+0}' \
            "${shard_dir}/results.tsv")

          cat > "${shard_dir}/summary.txt" <<EOF_SUMMARY
          shard=${SHARD}
          shard_count=${SHARD_COUNT}
          assigned_targets=${target_count}
          passed=${pass_count}
          failed=${fail_count}
          commit=${GITHUB_SHA}
          EOF_SUMMARY

          {
            echo "### Confirmed-success shard ${SHARD}"
            echo
            echo "- Assigned roots: **${target_count}**"
            echo "- Passed: **${pass_count}**"
            echo "- Regressions: **${fail_count}**"
          } >> "$GITHUB_STEP_SUMMARY"

          # Let all shards finish. The aggregate job is the sole failure gate.
          exit 0

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcfg2-success-v2-shard-${{ matrix.shard }}
          path: ci-artifacts/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  summarize:
    name: Summarize all 210 directly confirmed-success roots
    needs:
      - prepare
      - regression
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v7
        with:
          path: downloaded-artifacts

      - name: Verify complete exact coverage and regressions
        shell: bash
        env:
          EXPECTED_SHARDS: ${{ needs.prepare.outputs.shard_count }}
          EXPECTED_TARGETS: ${{ needs.prepare.outputs.success_count }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/combined

          set +e
          python3 <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          root = Path("downloaded-artifacts")
          out = Path("ci-artifacts/combined")
          expected_shards = int(os.environ["EXPECTED_SHARDS"])
          expected_targets = int(os.environ["EXPECTED_TARGETS"])

          manifests = list(root.rglob("successful-targets.txt"))
          if len(manifests) != 1:
              raise SystemExit(
                  f"Expected one successful-target manifest, found {len(manifests)}"
              )
          expected = [
              line.strip()
              for line in manifests[0].read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          result_files = sorted(root.rglob("results.tsv"))
          rows: list[tuple[str, int, str]] = []
          for file in result_files:
              for raw in file.read_text(errors="replace").splitlines():
                  if not raw.strip():
                      continue
                  status, seconds, target = raw.split("\t", 2)
                  rows.append((status, int(seconds), target))
          rows.sort(key=lambda row: row[2])

          observed_targets = [target for _, _, target in rows]
          failures = [(seconds, target) for status, seconds, target in rows if status == "FAIL"]
          passes = [(seconds, target) for status, seconds, target in rows if status == "PASS"]
          focused_files = sorted(root.rglob("focused/*.txt"))

          infrastructure_errors: list[str] = []
          if len(result_files) != expected_shards:
              infrastructure_errors.append(
                  f"Expected {expected_shards} shard result files, found {len(result_files)}"
              )
          if len(rows) != expected_targets:
              infrastructure_errors.append(
                  f"Expected {expected_targets} results, found {len(rows)}"
              )
          if len(set(observed_targets)) != len(observed_targets):
              infrastructure_errors.append("Duplicate target result detected")
          if set(observed_targets) != set(expected):
              missing = sorted(set(expected) - set(observed_targets))
              extra = sorted(set(observed_targets) - set(expected))
              infrastructure_errors.append(
                  f"Exact target-set mismatch: missing={len(missing)}, extra={len(extra)}"
              )
              (out / "missing-targets.txt").write_text(
                  "".join(f"{x}\n" for x in missing), encoding="utf-8"
              )
              (out / "unexpected-targets.txt").write_text(
                  "".join(f"{x}\n" for x in extra), encoding="utf-8"
              )
          if len(focused_files) != len(failures):
              infrastructure_errors.append(
                  f"Expected {len(failures)} focused diagnostics, found {len(focused_files)}"
              )

          (out / "combined-results.tsv").write_text(
              "".join(f"{status}\t{seconds}\t{target}\n" for status, seconds, target in rows),
              encoding="utf-8",
          )
          (out / "passed-targets.txt").write_text(
              "".join(f"{target}\n" for _, target in passes), encoding="utf-8"
          )
          (out / "regressed-targets.txt").write_text(
              "".join(f"{target}\n" for _, target in failures), encoding="utf-8"
          )
          (out / "infrastructure-errors.txt").write_text(
              "".join(f"{error}\n" for error in infrastructure_errors), encoding="utf-8"
          )
          (out / "all-focused-diagnostics.txt").write_text(
              "\n\n".join(f.read_text(errors="replace").rstrip() for f in focused_files) +
              ("\n" if focused_files else ""),
              encoding="utf-8",
          )

          summary = [
              "### MCFG2 confirmed-success regression result",
              "",
              f"- Snapshot: **{os.environ['MCFG2_SUCCESS_VERSION']}**",
              f"- Expected confirmed-success roots: **{expected_targets}**",
              f"- Results collected: **{len(rows)}**",
              f"- Passed: **{len(passes)}**",
              f"- Regressed: **{len(failures)}**",
              f"- Shards collected: **{len(result_files)}/{expected_shards}**",
              "",
          ]
          if failures:
              summary += ["#### Regressed roots", ""]
              summary += [f"- `{target}` ({seconds}s)" for seconds, target in failures]
              summary.append("")
          if infrastructure_errors:
              summary += ["#### Infrastructure errors", ""]
              summary += [f"- {error}" for error in infrastructure_errors]
              summary.append("")

          (out / "summary.md").write_text("\n".join(summary) + "\n", encoding="utf-8")
          print("\n".join(summary))

          if failures or infrastructure_errors:
              raise SystemExit(1)
          PY
          aggregate_status=$?
          set -e

          cat ci-artifacts/combined/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$aggregate_status"

      - name: Upload combined regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcfg2-success-v2-combined-${{ github.run_number }}
          path: ci-artifacts/combined
          if-no-files-found: error
          retention-days: 30

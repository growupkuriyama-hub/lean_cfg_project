name: ADP MCFG V12.1 - robust projected-word-disjoint OpenTelemetry experiment

run-name: >-
  ADP MCFG V12.1 ROBUST WORD-DISJOINT • ${{ github.event_name }} • run #${{ github.run_number }}

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/adaptive-h-MCFG-V12-word-disjoint.yml"
      - "LeanCfgProject/adaptive_h_mcfg2/**"
  workflow_dispatch:
    inputs:
      requested_replicas:
        description: Acquisition attempts per cart size (oversampled before balancing)
        required: true
        default: 10
        type: number
      minimum_replicas:
        description: Accepted traces retained per cart size
        required: true
        default: 5
        type: number
      max_count:
        description: Largest held-out test cart size (4 to 10)
        required: true
        default: 10
        type: number
      warmup_seconds:
        description: Warm-up after the OpenTelemetry Demo becomes ready
        required: true
        default: 45
        type: number
      flush_seconds:
        description: Telemetry flush delay after each checkout
        required: true
        default: 10
        type: number
      demo_ref:
        description: Pinned OpenTelemetry Demo commit
        required: true
        default: 3684411da9a4dc3e77cddfef929a630d6f5af6c5
        type: string

permissions:
  contents: read

concurrency:
  group: adp-mcfg-v12-word-disjoint-${{ github.ref }}
  cancel-in-progress: false

env:
  WORKFLOW_REVISION: "2026-07-30-v12.1-oversample-balance-acquisition-dropout"
  BASE_EXPERIMENT_RELATIVE_DIR: LeanCfgProject/adaptive_h_mcfg
  PATCH_EXPERIMENT_RELATIVE_DIR: LeanCfgProject/adaptive_h_mcfg2
  MERGED_EXPERIMENT_RELATIVE_DIR: _adaptive_h_mcfg_v12_merged
  DEMO_RELATIVE_DIR: _opentelemetry-demo
  OUTPUT_RELATIVE_DIR: adp-mcfg-v12-word-disjoint-results
  DIAGNOSTICS_RELATIVE_DIR: adp-mcfg-v12-diagnostics
  COMPOSE_PARALLEL_LIMIT: "2"
  DOCKER_CLIENT_TIMEOUT: "600"
  COMPOSE_HTTP_TIMEOUT: "600"

jobs:
  v12_word_disjoint_experiment:
    name: V12 count-controlled collection and word-disjoint evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out lean_cfg_project
        uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          docker system prune --all --force || true
          df -h

      - name: Check out pinned OpenTelemetry Demo
        uses: actions/checkout@v6
        with:
          repository: open-telemetry/opentelemetry-demo
          ref: ${{ github.event.inputs.demo_ref || '3684411da9a4dc3e77cddfef929a630d6f5af6c5' }}
          path: _opentelemetry-demo
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize V12 paths and parameters
        shell: bash
        run: |
          set -euxo pipefail

          REQUESTED_REPLICAS='${{ github.event.inputs.requested_replicas || '10' }}'
          MINIMUM_REPLICAS='${{ github.event.inputs.minimum_replicas || '5' }}'
          MAX_COUNT='${{ github.event.inputs.max_count || '10' }}'
          WARMUP_SECONDS='${{ github.event.inputs.warmup_seconds || '45' }}'
          FLUSH_SECONDS='${{ github.event.inputs.flush_seconds || '10' }}'

          test "$REQUESTED_REPLICAS" -ge "$MINIMUM_REPLICAS"
          test "$MINIMUM_REPLICAS" -ge 1
          test "$MAX_COUNT" -ge 4
          test "$MAX_COUNT" -le 10
          test "$WARMUP_SECONDS" -ge 0
          test "$FLUSH_SECONDS" -ge 0

          {
            echo "BASE_EXPERIMENT_DIR=$GITHUB_WORKSPACE/$BASE_EXPERIMENT_RELATIVE_DIR"
            echo "PATCH_EXPERIMENT_DIR=$GITHUB_WORKSPACE/$PATCH_EXPERIMENT_RELATIVE_DIR"
            echo "EXPERIMENT_DIR=$GITHUB_WORKSPACE/$MERGED_EXPERIMENT_RELATIVE_DIR"
            echo "DEMO_DIR=$GITHUB_WORKSPACE/$DEMO_RELATIVE_DIR"
            echo "OUTPUT_DIR=$GITHUB_WORKSPACE/$OUTPUT_RELATIVE_DIR"
            echo "DIAGNOSTICS_DIR=$GITHUB_WORKSPACE/$DIAGNOSTICS_RELATIVE_DIR"
            echo "PYTHONPATH=$GITHUB_WORKSPACE/$MERGED_EXPERIMENT_RELATIVE_DIR"
            echo "REQUESTED_REPLICAS=$REQUESTED_REPLICAS"
            echo "MINIMUM_REPLICAS=$MINIMUM_REPLICAS"
            echo "MAX_COUNT=$MAX_COUNT"
            echo "TEST_COUNTS=4-$MAX_COUNT"
            echo "WARMUP_SECONDS=$WARMUP_SECONDS"
            echo "FLUSH_SECONDS=$FLUSH_SECONDS"
          } >> "$GITHUB_ENV"

      - name: Assemble legacy implementation and V12 patch
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "$BASE_EXPERIMENT_DIR" ]; then
            echo "::error::Missing base implementation: $BASE_EXPERIMENT_DIR"
            exit 1
          fi
          if [ ! -d "$PATCH_EXPERIMENT_DIR" ]; then
            echo "::error::Missing V12 patch: $PATCH_EXPERIMENT_DIR"
            exit 1
          fi

          rm -rf "$EXPERIMENT_DIR"
          mkdir -p "$EXPERIMENT_DIR"
          cp -a "$BASE_EXPERIMENT_DIR/." "$EXPERIMENT_DIR/"
          cp -a "$PATCH_EXPERIMENT_DIR/." "$EXPERIMENT_DIR/"

          find "$EXPERIMENT_DIR" -maxdepth 3 -type f -print | sort \
            > "$GITHUB_WORKSPACE/v12-merged-file-list.txt"
          cat "$GITHUB_WORKSPACE/v12-merged-file-list.txt"

      - name: Make dataset construction dropout-tolerant but trace-strict
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$DIAGNOSTICS_DIR"
          cp "$EXPERIMENT_DIR/otel_demo/build_v12_dataset.py"             "$DIAGNOSTICS_DIR/build_v12_dataset.original.py"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["EXPERIMENT_DIR"]) / "otel_demo" / "build_v12_dataset.py"
          text = path.read_text(encoding="utf-8")
          old = '''    if rejected and not args.allow_multiple_matching_traces:
                  raise SystemExit(
                      f"strict dataset build rejected {len(rejected)} run(s); inspect dataset_summary.json"
                  )
          '''
          new = '''    if rejected and not args.allow_multiple_matching_traces:
                  print(
                      f"strict projection filter excluded {len(rejected)} acquisition attempt(s); "
                      "the downstream minimum-replica validator decides dataset sufficiency",
                      file=sys.stderr,
                  )
          '''
          if old not in text:
              raise SystemExit("Expected strict-rejection block was not found; refusing unsafe patch")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          cp "$EXPERIMENT_DIR/otel_demo/build_v12_dataset.py"             "$DIAGNOSTICS_DIR/build_v12_dataset.dropout_tolerant.py"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify V12 files and Demo commit
        shell: bash
        run: |
          set -euxo pipefail

          require_file() {
            if [ ! -f "$1" ]; then
              echo "::error::Missing required V12 file: $1"
              exit 1
            fi
          }

          require_file "$EXPERIMENT_DIR/otel_demo/collect_jaeger_v11.py"
          require_file "$EXPERIMENT_DIR/otel_demo/run_count_controlled_v12.py"
          require_file "$EXPERIMENT_DIR/otel_demo/build_v12_dataset.py"
          require_file "$EXPERIMENT_DIR/validate_v12_dataset.py"
          require_file "$EXPERIMENT_DIR/run_word_disjoint_v12.py"
          require_file "$EXPERIMENT_DIR/run_scaling_v12.py"
          require_file "$EXPERIMENT_DIR/run_v12_end_to_end.py"
          require_file "$EXPERIMENT_DIR/adaptive_h_mcfg/v12_baselines.py"
          require_file "$EXPERIMENT_DIR/adaptive_h_mcfg/v12_protocol.py"
          require_file "$EXPERIMENT_DIR/adaptive_h_mcfg/binary_learner.py"
          require_file "$EXPERIMENT_DIR/adaptive_h_mcfg/observers.py"
          require_file "$EXPERIMENT_DIR/adaptive_h_mcfg/selection.py"

          require_file "$DEMO_DIR/compose.yaml"
          require_file "$DEMO_DIR/compose.observability.yaml"
          require_file "$DEMO_DIR/compose.extras.yaml"
          require_file "$DEMO_DIR/.env"

          touch "$DEMO_DIR/.env.override"
          git -C "$DEMO_DIR" rev-parse HEAD | tee "$GITHUB_WORKSPACE/opentelemetry-demo-commit-v12.txt"
          test "$(cat "$GITHUB_WORKSPACE/opentelemetry-demo-commit-v12.txt")" = '${{ github.event.inputs.demo_ref || '3684411da9a4dc3e77cddfef929a630d6f5af6c5' }}'

      - name: Install dependencies and run V12 tests
        shell: bash
        run: |
          set -euxo pipefail
          cd "$EXPERIMENT_DIR"

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest scikit-learn
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            python -m pip install --editable .
          fi

          python -m pytest -q
          python -m compileall -q \
            adaptive_h_mcfg \
            otel_demo \
            validate_v12_dataset.py \
            run_word_disjoint_v12.py \
            run_scaling_v12.py \
            run_v12_end_to_end.py

          python - <<'PY'
          from adaptive_h_mcfg.v12_protocol import parse_int_spec
          from adaptive_h_mcfg.v12_baselines import KTailsAutomatonModel
          print("V12 import smoke test:", parse_int_spec("4-10"), KTailsAutomatonModel)
          PY

      - name: Validate Demo compose services
        shell: bash
        env:
          COMPOSE_ENV_FILES: .env,.env.override
        run: |
          set -euxo pipefail
          cd "$DEMO_DIR"
          mkdir -p "$DIAGNOSTICS_DIR"
          docker compose \
            -f compose.yaml \
            -f compose.observability.yaml \
            -f compose.extras.yaml \
            config --services | tee "$DIAGNOSTICS_DIR/compose-services.txt"
          grep -Fx checkout "$DIAGNOSTICS_DIR/compose-services.txt"
          grep -Fx load-generator "$DIAGNOSTICS_DIR/compose-services.txt"
          grep -Fx jaeger "$DIAGNOSTICS_DIR/compose-services.txt"

      - name: Pull Demo images with retries
        shell: bash
        timeout-minutes: 45
        env:
          COMPOSE_ENV_FILES: .env,.env.override
        run: |
          set -euo pipefail
          cd "$DEMO_DIR"
          mkdir -p "$DIAGNOSTICS_DIR"

          success=0
          for attempt in 1 2 3; do
            log="$DIAGNOSTICS_DIR/compose-pull-attempt-${attempt}.log"
            echo "Compose pull attempt ${attempt}/3"
            if docker compose \
              -f compose.yaml \
              -f compose.observability.yaml \
              -f compose.extras.yaml \
              pull --ignore-buildable >"$log" 2>&1; then
              success=1
              tail -n 100 "$log" || true
              break
            fi
            echo "::warning::Compose pull attempt ${attempt} failed"
            tail -n 160 "$log" || true
            docker system df || true
            [ "$attempt" -eq 3 ] || sleep $((attempt * 30))
          done

          if [ "$success" -ne 1 ]; then
            echo "::error::Unable to pull OpenTelemetry Demo images after three attempts"
            exit 1
          fi

      - name: Collect count-controlled normal traces
        shell: bash
        timeout-minutes: 90
        env:
          COMPOSE_ENV_FILES: .env,.env.override
        run: |
          set -euxo pipefail
          cd "$EXPERIMENT_DIR"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR/normal-runs"

          python otel_demo/run_count_controlled_v12.py "$DEMO_DIR" \
            --output "$OUTPUT_DIR/normal-runs" \
            --min-count 1 \
            --max-count "$MAX_COUNT" \
            --replicas "$REQUESTED_REPLICAS" \
            --warmup-seconds "$WARMUP_SECONDS" \
            --flush-seconds "$FLUSH_SECONDS" \
            --frontend-base "http://localhost:8080" \
            --jaeger-base "http://localhost:8080/jaeger/ui" \
            --compose-file compose.yaml \
            --compose-file compose.observability.yaml \
            --compose-file compose.extras.yaml

      - name: Build strict projections from all acquisition attempts
        shell: bash
        timeout-minutes: 20
        run: |
          set -euxo pipefail
          cd "$EXPERIMENT_DIR"
          rm -rf "$OUTPUT_DIR/dataset" "$OUTPUT_DIR/results"

          python otel_demo/build_v12_dataset.py "$OUTPUT_DIR/normal-runs" \
            --output "$OUTPUT_DIR/dataset" \
            --train-counts 1,2 \
            --validation-counts 3 \
            --test-counts "$TEST_COUNTS"

      - name: Balance to exactly the minimum accepted traces per cart size
        shell: bash
        run: |
          set -euxo pipefail
          cd "$EXPERIMENT_DIR"

          python - <<'PY'
          import csv
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          minimum = int(os.environ["MINIMUM_REPLICAS"])
          source = output / "dataset" / "projections.csv"
          backup = output / "dataset" / "projections_all_accepted.csv"
          rows = list(csv.DictReader(source.open(encoding="utf-8", newline="")))

          normal_run_ids = defaultdict(list)
          for row in rows:
              if row["label"] == "normal":
                  count = int(row["item_count"])
                  normal_run_ids[count].append(row["run_id"])

          selected = {}
          deficits = {}
          for count in range(1, int(os.environ["MAX_COUNT"]) + 1):
              available = sorted(set(normal_run_ids[count]))
              if len(available) < minimum:
                  deficits[count] = {"available": len(available), "required": minimum}
              else:
                  selected[count] = available[:minimum]

          selection_report = {
              "selection_rule": "lexicographically first accepted run IDs per item count",
              "minimum_replicas_per_count": minimum,
              "available_run_ids": {
                  str(k): sorted(set(v)) for k, v in sorted(normal_run_ids.items())
              },
              "selected_run_ids": {str(k): v for k, v in sorted(selected.items())},
              "deficits": {str(k): v for k, v in sorted(deficits.items())},
          }
          (output / "dataset" / "balanced_selection.json").write_text(
              json.dumps(selection_report, indent=2), encoding="utf-8"
          )
          if deficits:
              raise SystemExit(
                  "Insufficient accepted traces after oversampling:\n"
                  + json.dumps(selection_report, indent=2)
              )

          keep = {
              run_id
              for run_ids in selected.values()
              for run_id in run_ids
          }
          fieldnames = list(rows[0].keys())
          backup.write_text(source.read_text(encoding="utf-8"), encoding="utf-8")
          balanced = [row for row in rows if row["run_id"] in keep]
          with source.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(balanced)

          print(json.dumps(selection_report, indent=2))
          print(f"balanced rows: {len(balanced)}")
          PY

      - name: Validate and evaluate balanced projected-word-disjoint dataset
        shell: bash
        timeout-minutes: 60
        run: |
          set -euxo pipefail
          cd "$EXPERIMENT_DIR"
          mkdir -p "$OUTPUT_DIR/results"

          python validate_v12_dataset.py "$OUTPUT_DIR/dataset/projections.csv" \
            --output "$OUTPUT_DIR/dataset/validation_report.json" \
            --train-counts 1,2 \
            --validation-counts 3 \
            --test-counts "$TEST_COUNTS" \
            --minimum-replicas "$MINIMUM_REPLICAS"

          python run_word_disjoint_v12.py "$OUTPUT_DIR/dataset/projections.csv" \
            --output "$OUTPUT_DIR/results" \
            --train-counts 1,2 \
            --validation-counts 3 \
            --test-counts "$TEST_COUNTS" \
            --minimum-replicas "$MINIMUM_REPLICAS"

          python run_scaling_v12.py "$OUTPUT_DIR/dataset/projections.csv" \
            --output "$OUTPUT_DIR/results/training_scaling.csv" \
            --max-training-count 4 \
            --memory-gib 12 \
            --timeout-seconds 600

      - name: Enforce V12 success criteria
        shell: bash
        run: |
          set -euxo pipefail

          test -f "$OUTPUT_DIR/dataset/projections.csv"
          test -f "$OUTPUT_DIR/dataset/validation_report.json"
          test -f "$OUTPUT_DIR/dataset/dataset_summary.json"
          test -f "$OUTPUT_DIR/dataset/projections_all_accepted.csv"
          test -f "$OUTPUT_DIR/dataset/balanced_selection.json"
          test -f "$OUTPUT_DIR/results/metrics_unique_projection.csv"
          test -f "$OUTPUT_DIR/results/metrics_trace_instance.csv"
          test -f "$OUTPUT_DIR/results/model_complexity_and_runtime.csv"
          test -f "$OUTPUT_DIR/results/recognition_scaling_by_count.csv"
          test -f "$OUTPUT_DIR/results/training_scaling.csv"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          report_path = output / "dataset" / "validation_report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("ready_for_word_disjoint_evaluation") is not True:
              raise SystemExit(
                  "V12 validation failed: ready_for_word_disjoint_evaluation is not true\n"
                  + json.dumps(report, indent=2)
              )

          forbidden = list(output.rglob("*v11*"))
          if forbidden:
              raise SystemExit(f"Unexpected V11 output found: {forbidden}")

          print("V12_SUCCESS: ready_for_word_disjoint_evaluation=true")
          print(json.dumps(report, indent=2))
          PY

      - name: Print V12 result tables
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          echo '===== V12 VALIDATION REPORT ====='
          cat "$OUTPUT_DIR/dataset/validation_report.json"
          echo '===== UNIQUE-PROJECTION METRICS ====='
          cat "$OUTPUT_DIR/results/metrics_unique_projection.csv"
          echo '===== TRACE-INSTANCE METRICS ====='
          cat "$OUTPUT_DIR/results/metrics_trace_instance.csv"
          echo '===== MODEL COMPLEXITY AND RUNTIME ====='
          cat "$OUTPUT_DIR/results/model_complexity_and_runtime.csv"
          echo '===== RECOGNITION SCALING ====='
          cat "$OUTPUT_DIR/results/recognition_scaling_by_count.csv"
          echo '===== TRAINING SCALING ====='
          cat "$OUTPUT_DIR/results/training_scaling.csv"

      - name: Save diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$DIAGNOSTICS_DIR"
          date --iso-8601=seconds > "$DIAGNOSTICS_DIR/date.txt"
          printf '%s\n' "$WORKFLOW_REVISION" > "$DIAGNOSTICS_DIR/workflow-revision.txt"
          printf 'event=%s\nrun_id=%s\nrun_number=%s\nsha=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" \
            > "$DIAGNOSTICS_DIR/github-run.txt"
          python --version > "$DIAGNOSTICS_DIR/python.txt" 2>&1
          docker version > "$DIAGNOSTICS_DIR/docker-version.txt" 2>&1
          docker compose version > "$DIAGNOSTICS_DIR/compose-version.txt" 2>&1
          df -h > "$DIAGNOSTICS_DIR/disk.txt"
          free -h > "$DIAGNOSTICS_DIR/memory.txt"
          docker system df > "$DIAGNOSTICS_DIR/docker-disk.txt" 2>&1
          docker ps -a > "$DIAGNOSTICS_DIR/docker-containers.txt" 2>&1
          cp "$GITHUB_WORKSPACE/opentelemetry-demo-commit-v12.txt" "$DIAGNOSTICS_DIR/" 2>/dev/null
          cp "$GITHUB_WORKSPACE/v12-merged-file-list.txt" "$DIAGNOSTICS_DIR/" 2>/dev/null
          cp "$GITHUB_WORKSPACE/.github/workflows/adaptive-h-MCFG-V12-word-disjoint.yml" "$DIAGNOSTICS_DIR/" 2>/dev/null

          if [ -d "$DEMO_DIR" ]; then
            (
              cd "$DEMO_DIR" || exit 0
              COMPOSE_ENV_FILES=.env,.env.override docker compose \
                -f compose.yaml -f compose.observability.yaml -f compose.extras.yaml \
                ps -a > "$DIAGNOSTICS_DIR/compose-ps.txt" 2>&1
              COMPOSE_ENV_FILES=.env,.env.override docker compose \
                -f compose.yaml -f compose.observability.yaml -f compose.extras.yaml \
                logs --no-color --tail=2000 > "$DIAGNOSTICS_DIR/compose-logs.txt" 2>&1
            )
          fi

      - name: Stop Demo containers
        if: always()
        shell: bash
        run: |
          set +e
          if [ -d "$DEMO_DIR" ]; then
            cd "$DEMO_DIR" || exit 0
            COMPOSE_ENV_FILES=.env,.env.override docker compose \
              -f compose.yaml -f compose.observability.yaml -f compose.extras.yaml \
              down --remove-orphans --volumes
          fi

      - name: Upload V12 traces, audits, results, and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adp-mcfg-v12-word-disjoint-${{ github.run_id }}
          path: |
            adp-mcfg-v12-word-disjoint-results
            adp-mcfg-v12-diagnostics
            opentelemetry-demo-commit-v12.txt
            v12-merged-file-list.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

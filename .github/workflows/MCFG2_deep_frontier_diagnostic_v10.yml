name: MCFG2 Static Audit and Deep Frontier Diagnostics v10

on:
  workflow_dispatch:
    inputs:
      deep_layers:
        description: Maximum diagnostic-only sorry layers per shard
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
      apply_safe_autofix:
        description: Apply the generated safe syntax patch in CI scratch trees
        required: true
        default: true
        type: boolean
      run_success_regression:
        description: Recheck the 210 previously successful roots after the safe patch
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: mcfg2-deep-frontier-v10-${{ github.ref }}
  cancel-in-progress: true

env:
  MCFG2_DIAGNOSTIC_VERSION: "v10-static-clusters-sorry-deep-frontier"
  MCFG2_ROOT: LeanCfgProject/MCFG2
  MCFG2_DIAGNOSTIC_SHARDS: "12"
  MCFG2_TOTAL_SNAPSHOT_COUNT: "303"
  MCFG2_CONFIRMED_SUCCESS_COUNT: "210"
  MCFG2_UNVERIFIED_COUNT: "93"
  MCFG2_CONFIRMED_SUCCESS_SHA256: "f35e51c9a5c81c207b37a7201c7e0231ae699cf658ed60aef0084b2e17cfa438"
  MCFG2_UNVERIFIED_SHA256: "dcf7b58b27417d567a450a3d735ab42b5625b99ff1dcee1b3b6cf7de85224b86"

jobs:
  prepare:
    name: Prepare exact MCFG2 snapshots for v10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      source_files: ${{ steps.manifest.outputs.source_files }}
      root_targets: ${{ steps.manifest.outputs.root_targets }}
      unverified_targets: ${{ steps.manifest.outputs.unverified_targets }}
      shard_count: ${{ steps.manifest.outputs.shard_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate sources and define diagnostic shards
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ci-artifacts/manifest

          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["MCFG2_ROOT"])
          requested_shards = int(os.environ["MCFG2_DIAGNOSTIC_SHARDS"])
          expected_total = int(os.environ["MCFG2_TOTAL_SNAPSHOT_COUNT"])
          expected_success = int(os.environ["MCFG2_CONFIRMED_SUCCESS_COUNT"])
          expected_unverified = int(os.environ["MCFG2_UNVERIFIED_COUNT"])
          artifact_dir = Path("ci-artifacts/manifest")

          unverified_snapshot = """          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarBinaryRuleFamilyBodyBounds
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarCanonicalDecodedSearch
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarCanonicalSearchSelector
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarCertifiedDescriptionComplexity
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarCertifiedDescriptionProfile
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarCertifiedDescriptionRank
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarCertifiedDescriptionRankObstructions
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarCertifiedOutputLearner
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarCertifiedOutputMindChanges
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarCheckedBitRepresentation
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarFinalDescriptionPackage
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarFiniteCodeUniverse
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarFiniteDecodedSearch
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationAblation
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationAdditiveWeights
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationBudgetFiltration
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationEquivalenceChain
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationFiniteOptimization
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationOptimizationSelector
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationParetoSelection
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationProduct
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationRefinementFailure
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelection
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionBoundedDecisionSearch
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionCanonicalMinimumCertificate
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionCanonicalMinimumCertificateSearch
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionCardinalityRank
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionComplexity
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionCostOverhead
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionDecisionProblem
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionDenseCertificateEncoding
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedCanonicalPolynomialWitness
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedCanonicalSelector
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedCertificateSearch
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedCertificateSpecification
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedCertifiedSelector
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedCompactInstance
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedCompactVerifier
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedCompactVerifierRuntime
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedDecisionOptimization
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedDecisionThreshold
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedExecutableVerifier
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedExecutableVerifierComplexity
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedInstance
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedInstanceSerialization
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedPolynomialVerifier
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedPolynomialWitness
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSemanticOracleBoundary
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedCertificateVerifier
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedDecisionProblem
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedMachineModelAdapter
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedNPStyleCanonicalWitness
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedNPStyleClass
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedNPStyleMembership
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedNPStyleMinimumBudgetSelector
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedNPStyleThreshold
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedPolynomialDecisionProblem
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedPolynomialWitness
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedStandardMachineRealization
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedVerifier
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedSerializedVerifierComplexity
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedThresholdSearch
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedTotalSearch
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionEncodedVerifierComplexity
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionIrredundancy
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionMinimumBudgetSelector
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionMinimumCertificateSelector
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankEnvelope
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileExtremes
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsetBijection
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsetFirstGapBounds
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsetGapAlternative
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsetGapDecision
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsetGapFree
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsetGapSelectionFamily
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsetGaps
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsetOrder
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsetSelector
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileOffsets
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfileWidth
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankProfiles
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionParetoRankSelector
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionPositiveAdditiveRank
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionRank
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionRankComparison
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionRankOne
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionRankSensitivity
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationSelectionRankZero
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarObservationWeightedSelection
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarPaperBitEnvelope
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarPaperPowerBitBound
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarSampleParametricBitBound
          LeanCfgProject.MCFG2.ConcreteCanonicalLearnerWorkingGrammarUniformNaturalFieldBound
          """
          unverified = [line.strip() for line in unverified_snapshot.splitlines() if line.strip()]

          if not root.is_dir():
              raise SystemExit(f"Directory not found: {root}")

          files = sorted(root.rglob("*.lean"))
          if not files:
              raise SystemExit(f"No Lean files found under {root}")

          component = re.compile(r"^[A-Za-z_][A-Za-z0-9_']*$")
          numbered_copy = re.compile(r"^(?P<base>.+)\((?P<number>[0-9]+)\)\.lean$")

          targets: list[str] = []
          valid_files: list[str] = []
          duplicate_aliases: list[dict[str, str]] = []
          invalid_files: list[str] = []

          for file in files:
              module_parts = file.with_suffix("").parts
              if all(component.fullmatch(part) for part in module_parts):
                  targets.append(".".join(module_parts))
                  valid_files.append(file.as_posix())
                  continue

              match = numbered_copy.fullmatch(file.name)
              if match is None:
                  invalid_files.append(
                      f"{file}: invalid Lean module filename and not a numbered copy"
                  )
                  continue

              canonical = file.with_name(match.group("base") + ".lean")
              if not canonical.is_file():
                  invalid_files.append(
                      f"{file}: numbered copy has no canonical sibling {canonical}"
                  )
                  continue

              if file.read_bytes() != canonical.read_bytes():
                  invalid_files.append(
                      f"{file}: differs from canonical sibling {canonical}"
                  )
                  continue

              duplicate_aliases.append(
                  {"duplicate": file.as_posix(), "canonical": canonical.as_posix()}
              )

          if invalid_files:
              print("Invalid MCFG2 source files:")
              for item in invalid_files:
                  print(f"  - {item}")
              raise SystemExit(2)

          accounted = len(targets) + len(duplicate_aliases)
          if accounted != len(files):
              raise SystemExit(
                  f"Manifest mismatch: accounted for {accounted} of {len(files)} files"
              )

          if len(targets) != expected_total:
              raise SystemExit(
                  f"Expected {expected_total} canonical MCFG2 roots, found {len(targets)}"
              )
          if len(unverified) != expected_unverified or len(set(unverified)) != len(unverified):
              raise SystemExit(
                  f"Unverified snapshot must contain {expected_unverified} unique roots"
              )

          target_set = set(targets)
          missing = sorted(set(unverified) - target_set)
          if missing:
              print("Unverified snapshot entries missing from repository:")
              for target in missing:
                  print(f"  - {target}")
              raise SystemExit(3)

          confirmed = sorted(target_set - set(unverified))
          if len(confirmed) != expected_success:
              raise SystemExit(
                  f"Expected {expected_success} confirmed-success roots, found {len(confirmed)}"
              )

          def digest(lines: list[str]) -> str:
              payload = "".join(f"{line}\n" for line in sorted(lines)).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          unverified_hash = digest(unverified)
          success_hash = digest(confirmed)
          if unverified_hash != os.environ["MCFG2_UNVERIFIED_SHA256"]:
              raise SystemExit(
                  f"Unverified target-set hash mismatch: {unverified_hash}"
              )
          if success_hash != os.environ["MCFG2_CONFIRMED_SUCCESS_SHA256"]:
              raise SystemExit(
                  f"Confirmed-success complement hash mismatch: {success_hash}"
              )

          unverified = sorted(unverified)
          shard_count = min(max(1, requested_shards), len(unverified))
          matrix = list(range(shard_count))

          (artifact_dir / "mcfg2-all-targets.txt").write_text(
              "".join(f"{target}\n" for target in sorted(targets)), encoding="utf-8"
          )
          (artifact_dir / "mcfg2-unverified-targets.txt").write_text(
              "".join(f"{target}\n" for target in unverified), encoding="utf-8"
          )
          (artifact_dir / "mcfg2-confirmed-success-targets.txt").write_text(
              "".join(f"{target}\n" for target in confirmed), encoding="utf-8"
          )
          (artifact_dir / "mcfg2-valid-files.txt").write_text(
              "".join(f"{file}\n" for file in valid_files), encoding="utf-8"
          )
          (artifact_dir / "mcfg2-duplicate-aliases.json").write_text(
              json.dumps(duplicate_aliases, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          summary = {
              "source_files": len(files),
              "root_targets": len(targets),
              "confirmed_success_targets": len(confirmed),
              "unverified_targets": len(unverified),
              "confirmed_success_sha256": success_hash,
              "unverified_sha256": unverified_hash,
              "shard_count": shard_count,
              "matrix": matrix,
          }
          (artifact_dir / "mcfg2-matrix-summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
              output.write(f"source_files={len(files)}\n")
              output.write(f"root_targets={len(targets)}\n")
              output.write(f"unverified_targets={len(unverified)}\n")
              output.write(f"shard_count={shard_count}\n")

          print(
              f"Prepared exact {len(unverified)}-root unverified matrix "
              f"with {len(confirmed)} confirmed-success roots excluded."
          )
          print(f"Diagnostic workflow version: {os.environ['MCFG2_DIAGNOSTIC_VERSION']}")
          PY

      - name: Upload matrix manifest
        uses: actions/upload-artifact@v7
        with:
          name: mcfg2-v10-matrix-manifest
          path: ci-artifacts/manifest
          if-no-files-found: error
          retention-days: 14


  static-audit:
    name: Whole-tree static audit and safe batch patch
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan all MCFG2 sources and cluster recurring causes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-tools
          cat > ci-tools/mcfg2_static_audit.py <<'PY'
          from __future__ import annotations

          import difflib
          import os
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          root = Path(os.environ.get("MCFG2_ROOT", "LeanCfgProject/MCFG2"))
          out = Path("ci-artifacts/static-audit")
          out.mkdir(parents=True, exist_ok=True)

          if not root.is_dir():
              raise SystemExit(f"MCFG2 root does not exist: {root}")

          files = sorted(root.rglob("*.lean"))
          findings: list[tuple[str, str, int, str]] = []
          changed: dict[Path, str] = {}

          split_projection = re.compile(
              r"(?P<base>[\)\]])\.(?P<gap>[ \t]*\n[ \t]*)(?P<field>[A-Za-z_][A-Za-z0-9_']*)"
          )
          known_universe_functions = re.compile(
              r"\b(?:"
              r"CheckedBitBoundedCutCompiledWorkingGrammarRepresentation|"
              r"CheckedBitBoundedCutCompiledWorkingGrammarLanguageClass|"
              r"BoundedCutCompiledWorkingGrammarRepresentation|"
              r"BoundedCutCompiledWorkingGrammarLanguageClass"
              r")\b"
          )
          simpa_using = re.compile(r"\bsimpa\s*\[[^\n]*\]\s+using\b")
          ring_line = re.compile(r"^\s*(?:ring|ring_nf)\s*$", re.MULTILINE)

          decl_start = re.compile(
              r"^(?:(?:private|protected|noncomputable|local)\s+)*"
              r"(?P<kind>theorem|lemma|example)\b(?P<rest>.*)$",
              re.MULTILINE,
          )
          top_level = re.compile(
              r"^(?:@\[|/--|/-!|--!|"
              r"(?:(?:private|protected|noncomputable|local)\s+)*"
              r"(?:theorem|lemma|example|def|abbrev|opaque|axiom|structure|class|"
              r"inductive|instance|section|namespace|end|variable|include|omit|"
              r"open|set_option|universe|attribute|export)\b)",
              re.MULTILINE,
          )


          def line_of(text: str, offset: int) -> int:
              return text.count("\n", 0, offset) + 1


          for path in files:
              text = path.read_text(encoding="utf-8")
              rel = path.as_posix()

              for match in split_projection.finditer(text):
                  field = match.group("field")
                  findings.append(
                      (
                          "split-field-projection",
                          rel,
                          line_of(text, match.start()),
                          f"safe autofix: join dot with field `{field}`",
                      )
                  )

              for function_match in known_universe_functions.finditer(text):
                  # Inspect only the nearby call head, stopping at a blank line or 500
                  # characters. This avoids treating ordinary term arguments named `z`
                  # elsewhere in the project as universe errors.
                  tail_end = min(len(text), function_match.end() + 500)
                  blank = text.find("\n\n", function_match.end(), tail_end)
                  if blank != -1:
                      tail_end = blank
                  call_head = text[function_match.end():tail_end]
                  for argument_match in re.finditer(r"\((w|z)\s*:=", call_head):
                      argument = argument_match.group(1)
                      offset = function_match.end() + argument_match.start()
                      findings.append(
                          (
                              f"named-universe-{argument}",
                              rel,
                              line_of(text, offset),
                              f"review: `{function_match.group(0)}` receives universe `{argument}` as an ordinary named argument",
                          )
                      )

              for match in simpa_using.finditer(text):
                  findings.append(
                      (
                          "simpa-overunfold-candidate",
                          rel,
                          line_of(text, match.start()),
                          "review: `simpa [...] using` can simplify beyond the intended intermediate form",
                      )
                  )

              for match in ring_line.finditer(text):
                  findings.append(
                      (
                          "ring-on-order-candidate",
                          rel,
                          line_of(text, match.start()),
                          "review: `ring` normalizes equalities but may leave reflexive inequalities",
                      )
                  )

              starts = list(decl_start.finditer(text))
              for index, start in enumerate(starts):
                  next_match = top_level.search(text, start.end())
                  end = next_match.start() if next_match else len(text)
                  segment = text[start.start():end]
                  proof = re.search(r":=\s*by\b", segment)
                  if not proof:
                      continue
                  statement = segment[: proof.start()]
                  body = segment[proof.end():]
                  if "hα" not in statement and re.search(r"\bhα\b", body):
                      preceding = text[max(0, start.start() - 2000):start.start()]
                      if not re.search(r"^include\s+hα\s*$", preceding, re.MULTILINE):
                          name_match = re.match(
                              r"\s*(?:[A-Za-z_][A-Za-z0-9_']*)?", start.group("rest")
                          )
                          name = name_match.group(0).strip() if name_match else ""
                          findings.append(
                              (
                                  "proof-only-halpha-candidate",
                                  rel,
                                  line_of(text, start.start()),
                                  f"review: {start.group('kind')} {name or '<anonymous>'} uses hα only in proof; consider `include hα`",
                              )
                          )

              fixed = split_projection.sub(lambda m: f"{m.group('base')}.{m.group('field')}", text)
              if fixed != text:
                  changed[path] = fixed

          findings.sort(key=lambda row: (row[0], row[1], row[2], row[3]))

          with (out / "findings.tsv").open("w", encoding="utf-8") as handle:
              handle.write("cause\tfile\tline\tdetail\n")
              for cause, file, line, detail in findings:
                  clean = detail.replace("\t", " ").replace("\n", " ")
                  handle.write(f"{cause}\t{file}\t{line}\t{clean}\n")

          patch_parts: list[str] = []
          for path, fixed in sorted(changed.items(), key=lambda item: item[0].as_posix()):
              original = path.read_text(encoding="utf-8")
              patch_parts.extend(
                  difflib.unified_diff(
                      original.splitlines(keepends=True),
                      fixed.splitlines(keepends=True),
                      fromfile=f"a/{path.as_posix()}",
                      tofile=f"b/{path.as_posix()}",
                  )
              )
          (out / "safe-autofix.patch").write_text("".join(patch_parts), encoding="utf-8")

          counts = Counter(row[0] for row in findings)
          files_by_cause: dict[str, set[str]] = defaultdict(set)
          for cause, file, _, _ in findings:
              files_by_cause[cause].add(file)

          report = [
              "# MCFG2 whole-tree static audit",
              "",
              f"- Lean source files scanned: **{len(files)}**",
              f"- Findings: **{len(findings)}**",
              f"- Files changed by safe autofix: **{len(changed)}**",
              "",
              "Only split field projections are automatically patched. Universe arguments,",
              "section dependencies, simplification behavior, and arithmetic tactics are",
              "reported for review and are not modified automatically.",
              "",
              "## Cause clusters",
              "",
          ]
          if counts:
              for cause, count in sorted(counts.items(), key=lambda item: (-item[1], item[0])):
                  report.append(
                      f"- **{cause}**: {count} occurrence(s), {len(files_by_cause[cause])} file(s)"
                  )
          else:
              report.append("No configured static patterns were found.")

          report.extend(["", "## Files by cause", ""])
          for cause in sorted(files_by_cause):
              report.append(f"### {cause}")
              report.append("")
              for file in sorted(files_by_cause[cause]):
                  report.append(f"- `{file}`")
              report.append("")

          (out / "cause-clusters.md").write_text("\n".join(report) + "\n", encoding="utf-8")

          suggestions = """# Suggested repair templates

          These are review hints, not automatic edits.

          ## Universe levels

          When `w` and `z` are universe parameters, instantiate them with universe syntax:

          ```lean
          SomeRepresentation.{u, w, z} α ...
          ```

          Do not pass them as ordinary term arguments `(w := w)` or `(z := z)`.

          ## Proof-only section variables

          When `hα` is used only in theorem proofs, add this before the affected theorem group:

          ```lean
          include hα
          ```

          ## Simplification at an intermediate representation

          When `simpa [definition] using h` unfolds too far, prefer a controlled rewrite:

          ```lean
          rw [definition] at h
          exact h
          ```

          ## Ring normalization and inequalities

          For a goal that is reflexive after normalization, use `simpa [...]`, a `calc`
          block with an equality step, or `change`; do not rely on `ring` alone to close
          an inequality.
          """
          (out / "suggested-fixes.md").write_text(suggestions, encoding="utf-8")

          print("\n".join(report))
          PY
          python3 ci-tools/mcfg2_static_audit.py
          cat ci-artifacts/static-audit/cause-clusters.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload static audit and safe autofix patch
        uses: actions/upload-artifact@v7
        with:
          name: mcfg2-v10-static-audit
          path: ci-artifacts/static-audit
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  deep-diagnose:
    name: Deep frontier v10 shard ${{ matrix.shard }}
    needs:
      - prepare
      - static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Download fixed target manifest
        uses: actions/download-artifact@v7
        with:
          name: mcfg2-v10-matrix-manifest
          path: ci-input/manifest

      - name: Download static audit patch
        uses: actions/download-artifact@v7
        with:
          name: mcfg2-v10-static-audit
          path: ci-input/static-audit

      - name: Run layered scratch-tree diagnostics
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
          DEEP_LAYERS: ${{ inputs.deep_layers }}
          APPLY_SAFE_AUTOFIX: ${{ inputs.apply_safe_autofix }}
        run: |
          set -euo pipefail
          mkdir -p ci-tools
          cat > ci-tools/mcfg2_deep_driver.py <<'PY'
          from __future__ import annotations

          import csv
          import os
          import re
          import shutil
          import subprocess
          import time
          from collections import Counter, defaultdict
          from dataclasses import dataclass
          from pathlib import Path

          ROOT = Path(os.environ.get("MCFG2_ROOT", "LeanCfgProject/MCFG2"))
          SHARD = int(os.environ["SHARD"])
          SHARD_COUNT = int(os.environ["SHARD_COUNT"])
          MAX_LAYERS = int(os.environ.get("DEEP_LAYERS", "4"))
          APPLY_SAFE = os.environ.get("APPLY_SAFE_AUTOFIX", "true").lower() == "true"
          MANIFEST = Path("ci-input/manifest/mcfg2-unverified-targets.txt")
          SAFE_PATCH = Path("ci-input/static-audit/safe-autofix.patch")
          OUT = Path(f"ci-artifacts/deep-shard-{SHARD}")
          LOGS = OUT / "logs"
          OUT.mkdir(parents=True, exist_ok=True)
          LOGS.mkdir(parents=True, exist_ok=True)

          ANSI = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          LOCATION = re.compile(
              r"(?P<file>LeanCfgProject/MCFG2/[A-Za-z0-9_./'\-]+\.lean):"
              r"(?P<line>\d+):(?P<col>\d+):\s*"
              r"(?:(?P<severity>error|warning)(?:\([^)]*\))?:\s*)?(?P<message>.*)"
          )
          DECL_START = re.compile(
              r"^(?:(?:private|protected|noncomputable|local)\s+)*"
              r"(?P<kind>theorem|lemma|example)\b(?P<rest>.*)$",
              re.MULTILINE,
          )
          TOP_LEVEL = re.compile(
              r"^(?:@\[|/--|/-!|--!|"
              r"(?:(?:private|protected|noncomputable|local)\s+)*"
              r"(?:theorem|lemma|example|def|abbrev|opaque|axiom|structure|class|"
              r"inductive|instance|section|namespace|end|variable|include|omit|"
              r"open|set_option|universe|attribute|export)\b)",
              re.MULTILINE,
          )


          @dataclass(frozen=True)
          class Error:
              root: str
              file: str
              line: int
              col: int
              message: str
              cause: str


          @dataclass(frozen=True)
          class ProofSpan:
              file: str
              start: int
              end: int
              proof_start: int
              declaration_line: int
              proof_line: int
              kind: str
              name: str


          def classify(message: str) -> str:
              lower = message.lower()
              if "invalid argument name `w`" in lower or "invalid argument name `z`" in lower:
                  return "universe-instantiation"
              if "invalid field notation: identifier or numeral expected" in lower:
                  return "split-field-projection"
              if "unknown identifier `hα`" in message or "unknown identifier 'hα'" in lower:
                  return "missing-include-halpha"
              if "unsolved goal" in lower:
                  return "proof-obligation"
              if "type mismatch" in lower:
                  return "type-mismatch"
              if "failed to synthesize" in lower:
                  return "typeclass-synthesis"
              if "unexpected token" in lower or "invalid syntax" in lower or "parser" in lower:
                  return "parser"
              if "maximum recursion depth" in lower or "timeout" in lower:
                  return "resource-limit"
              if "unknown identifier" in lower or "unknown constant" in lower:
                  return "unknown-name"
              if "invalid field" in lower:
                  return "field-application"
              return "other"


          def source_for_module(module: str) -> Path:
              return Path(module.replace(".", "/") + ".lean")


          def clear_mcfg2_products() -> None:
              for path in [
                  Path(".lake/build/lib/lean/LeanCfgProject/MCFG2"),
                  Path(".lake/build/ir/LeanCfgProject/MCFG2"),
              ]:
                  shutil.rmtree(path, ignore_errors=True)


          def clear_root_products(module: str) -> None:
              module_path = module.replace(".", "/")
              candidates = [
                  f".lake/build/lib/lean/{module_path}.olean",
                  f".lake/build/lib/lean/{module_path}.ilean",
                  f".lake/build/lib/lean/{module_path}.olean.hash",
                  f".lake/build/lib/lean/{module_path}.trace",
                  f".lake/build/ir/{module_path}.c",
                  f".lake/build/ir/{module_path}.o",
                  f".lake/build/ir/{module_path}.setup.json",
              ]
              for item in candidates:
                  Path(item).unlink(missing_ok=True)


          def parse_errors(root: str, output: str) -> list[Error]:
              clean = ANSI.sub("", output)
              parsed: list[Error] = []
              for raw in clean.splitlines():
                  match = LOCATION.search(raw)
                  if not match:
                      continue
                  message = match.group("message").strip()
                  if not message or match.group("severity") == "warning":
                      continue
                  parsed.append(
                      Error(
                          root=root,
                          file=match.group("file"),
                          line=int(match.group("line")),
                          col=int(match.group("col")),
                          message=message,
                          cause=classify(message),
                      )
                  )
              return parsed


          def declaration_spans(path: Path) -> list[ProofSpan]:
              text = path.read_text(encoding="utf-8")
              spans: list[ProofSpan] = []
              for start in DECL_START.finditer(text):
                  boundary = TOP_LEVEL.search(text, start.end())
                  end = boundary.start() if boundary else len(text)
                  segment = text[start.start():end]
                  proof_matches = list(re.finditer(r":=\s*by\b", segment))
                  if not proof_matches:
                      continue
                  proof = proof_matches[-1]
                  proof_start = start.start() + proof.start()
                  decl_line = text.count("\n", 0, start.start()) + 1
                  proof_line = text.count("\n", 0, proof_start) + 1
                  rest = start.group("rest").strip()
                  name_match = re.match(r"([A-Za-z_][A-Za-z0-9_']*)", rest)
                  name = name_match.group(1) if name_match else "<anonymous>"
                  spans.append(
                      ProofSpan(
                          file=path.as_posix(),
                          start=start.start(),
                          end=end,
                          proof_start=proof_start,
                          declaration_line=decl_line,
                          proof_line=proof_line,
                          kind=start.group("kind"),
                          name=name,
                      )
                  )
              return spans


          def find_bypass(error: Error, cache: dict[str, list[ProofSpan]]) -> ProofSpan | None:
              if error.cause == "parser":
                  return None
              path = Path(error.file)
              if not path.is_file() or not path.is_relative_to(ROOT):
                  return None
              spans = cache.setdefault(error.file, declaration_spans(path))
              candidates = [
                  span
                  for span in spans
                  if span.declaration_line <= error.line
                  and error.line >= span.proof_line
                  and error.line <= Path(error.file).read_text(encoding="utf-8").count("\n", 0, span.end) + 1
              ]
              if not candidates:
                  return None
              span = max(candidates, key=lambda item: item.declaration_line)
              segment = path.read_text(encoding="utf-8")[span.start:span.end]
              if re.search(r"\bsorry\b", segment):
                  return None
              return span


          def apply_bypasses(layer: int, errors: list[Error]) -> int:
              cache: dict[str, list[ProofSpan]] = {}
              selected: dict[tuple[str, int], tuple[ProofSpan, list[Error]]] = {}
              for error in errors:
                  span = find_bypass(error, cache)
                  if span is None:
                      continue
                  selected.setdefault((span.file, span.start), (span, []))[1].append(error)

              by_file: dict[str, list[tuple[ProofSpan, list[Error]]]] = defaultdict(list)
              for span, related in selected.values():
                  by_file[span.file].append((span, related))

              manifest = OUT / "bypass-manifest.tsv"
              new_manifest = not manifest.exists()
              with manifest.open("a", encoding="utf-8", newline="") as handle:
                  writer = csv.writer(handle, delimiter="\t", lineterminator="\n")
                  if new_manifest:
                      writer.writerow(
                          [
                              "layer",
                              "file",
                              "declaration_line",
                              "kind",
                              "name",
                              "trigger_lines",
                              "roots",
                          ]
                      )
                  for file, entries in sorted(by_file.items()):
                      path = Path(file)
                      text = path.read_text(encoding="utf-8")
                      replacements: list[tuple[int, int, str]] = []
                      for span, related in entries:
                          replacements.append((span.proof_start, span.end, ":= by\n  sorry\n\n"))
                          writer.writerow(
                              [
                                  layer,
                                  file,
                                  span.declaration_line,
                                  span.kind,
                                  span.name,
                                  ",".join(str(n) for n in sorted({e.line for e in related})),
                                  ",".join(sorted({e.root for e in related})),
                              ]
                          )
                      for start, end, replacement in sorted(replacements, reverse=True):
                          text = text[:start] + replacement + text[end:]
                      path.write_text(text, encoding="utf-8")
              return len(selected)


          def write_layer(
              layer: int,
              results: list[tuple[str, str, int]],
              errors: list[Error],
          ) -> None:
              layer_dir = OUT / f"layer-{layer}"
              layer_dir.mkdir(parents=True, exist_ok=True)
              with (layer_dir / "results.tsv").open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.writer(handle, delimiter="\t", lineterminator="\n")
                  writer.writerow(["status", "elapsed_seconds", "root"])
                  writer.writerows(results)
              with (layer_dir / "errors.tsv").open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.writer(handle, delimiter="\t", lineterminator="\n")
                  writer.writerow(["root", "cause", "file", "line", "col", "message"])
                  for e in errors:
                      writer.writerow([e.root, e.cause, e.file, e.line, e.col, e.message])
              causes = Counter(e.cause for e in errors)
              passed = sum(1 for status, _, _ in results if status == "PASS")
              failed = sum(1 for status, _, _ in results if status == "FAIL")
              report = [
                  f"# Deep diagnostic shard {SHARD}, layer {layer}",
                  "",
                  f"- Active roots checked: **{len(results)}**",
                  f"- Passed at this layer: **{passed}**",
                  f"- Failed at this layer: **{failed}**",
                  f"- Parsed source diagnostics: **{len(errors)}**",
                  "",
                  "## Cause clusters",
                  "",
              ]
              if causes:
                  report.extend(f"- **{cause}**: {count}" for cause, count in sorted(causes.items()))
              else:
                  report.append("No source-located diagnostics were parsed.")
              (layer_dir / "summary.md").write_text("\n".join(report) + "\n", encoding="utf-8")


          def apply_safe_patch() -> None:
              if not APPLY_SAFE or not SAFE_PATCH.is_file() or SAFE_PATCH.stat().st_size == 0:
                  return
              proc = subprocess.run(
                  ["git", "apply", "--whitespace=nowarn", str(SAFE_PATCH)],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              (OUT / "safe-autofix-apply.log").write_text(proc.stdout, encoding="utf-8")
              if proc.returncode != 0:
                  raise SystemExit(f"safe autofix patch could not be applied:\n{proc.stdout}")


          all_targets = [line.strip() for line in MANIFEST.read_text(encoding="utf-8").splitlines() if line.strip()]
          targets = [target for index, target in enumerate(all_targets) if index % SHARD_COUNT == SHARD]
          (OUT / "assigned-targets.txt").write_text("\n".join(targets) + "\n", encoding="utf-8")

          apply_safe_patch()
          active = targets[:]
          clear_mcfg2_products()

          for layer in range(MAX_LAYERS):
              if not active:
                  break
              results: list[tuple[str, str, int]] = []
              errors: list[Error] = []
              failed: list[str] = []
              layer_log_dir = LOGS / f"layer-{layer}"
              layer_log_dir.mkdir(parents=True, exist_ok=True)

              for target in active:
                  clear_root_products(target)
                  safe_name = target.replace(".", "_")
                  start = time.monotonic()
                  proc = subprocess.run(
                      ["lake", "build", target],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  elapsed = int(time.monotonic() - start)
                  (layer_log_dir / f"{safe_name}.log").write_text(proc.stdout, encoding="utf-8")
                  if proc.returncode == 0:
                      results.append(("PASS", str(elapsed), target))
                  else:
                      results.append(("FAIL", str(elapsed), target))
                      failed.append(target)
                      errors.extend(parse_errors(target, proc.stdout))

              write_layer(layer, results, errors)
              active = failed
              if not active or layer + 1 >= MAX_LAYERS:
                  break

              bypassed = apply_bypasses(layer, errors)
              with (OUT / "layer-transitions.tsv").open("a", encoding="utf-8") as handle:
                  handle.write(f"{layer}\t{len(active)}\t{bypassed}\n")
              if bypassed == 0:
                  break
              clear_mcfg2_products()

          (OUT / "remaining-roots.txt").write_text("\n".join(active) + ("\n" if active else ""), encoding="utf-8")

          with (OUT / "diagnostic-scratch.patch").open("w", encoding="utf-8") as handle:
              subprocess.run(
                  ["git", "diff", "--", str(ROOT)],
                  text=True,
                  stdout=handle,
                  stderr=subprocess.STDOUT,
                  check=False,
              )

          warning = """# Diagnostic scratch patch — DO NOT APPLY

          This patch may contain `sorry` replacements inserted only to expose errors
          behind failed proof imports. It is not a source repair and must never be
          committed or applied to the real project. The separate static-audit artifact
          contains the only automatically generated safe patch.
          """
          (OUT / "DO_NOT_APPLY_DIAGNOSTIC_PATCH.md").write_text(warning, encoding="utf-8")
          print(f"Shard {SHARD}: assigned={len(targets)}, remaining={len(active)}, layers={MAX_LAYERS}")
          PY
          python3 ci-tools/mcfg2_deep_driver.py

          latest_summary=$(find "ci-artifacts/deep-shard-${SHARD}" -path '*/layer-*/summary.md' -type f | sort -V | tail -n 1 || true)
          if [[ -n "$latest_summary" ]]; then
            cat "$latest_summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload layered shard diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcfg2-v10-deep-shard-${{ matrix.shard }}
          path: ci-artifacts/deep-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  deep-summarize:
    name: Aggregate cause clusters and deep frontiers
    needs:
      - prepare
      - static-audit
      - deep-diagnose
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download all deep shard artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: mcfg2-v10-deep-shard-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Aggregate layered results
        shell: bash
        env:
          EXPECTED_SHARDS: ${{ needs.prepare.outputs.shard_count }}
        run: |
          set -euo pipefail
          mkdir -p ci-tools
          cat > ci-tools/mcfg2_deep_aggregate.py <<'PY'
          from __future__ import annotations

          import csv
          import os
          from collections import Counter, defaultdict
          from pathlib import Path

          artifacts = Path("downloaded-artifacts")
          out = Path("ci-artifacts/deep-combined")
          out.mkdir(parents=True, exist_ok=True)

          error_rows: list[dict[str, str]] = []
          result_rows: list[dict[str, str]] = []
          bypass_rows: list[dict[str, str]] = []
          remaining: set[str] = set()
          shards_seen: set[str] = set()

          for shard_dir in sorted(artifacts.glob("mcfg2-v10-deep-shard-*")):
              shard = shard_dir.name.rsplit("-", 1)[-1]
              shards_seen.add(shard)
              for path in sorted(shard_dir.glob("layer-*/errors.tsv")):
                  layer = path.parent.name.split("-", 1)[-1]
                  with path.open(encoding="utf-8", newline="") as handle:
                      for row in csv.DictReader(handle, delimiter="\t"):
                          row["layer"] = layer
                          row["shard"] = shard
                          error_rows.append(row)
              for path in sorted(shard_dir.glob("layer-*/results.tsv")):
                  layer = path.parent.name.split("-", 1)[-1]
                  with path.open(encoding="utf-8", newline="") as handle:
                      for row in csv.DictReader(handle, delimiter="\t"):
                          row["layer"] = layer
                          row["shard"] = shard
                          result_rows.append(row)
              manifest = shard_dir / "bypass-manifest.tsv"
              if manifest.is_file():
                  with manifest.open(encoding="utf-8", newline="") as handle:
                      for row in csv.DictReader(handle, delimiter="\t"):
                          row["shard"] = shard
                          bypass_rows.append(row)
              remaining_file = shard_dir / "remaining-roots.txt"
              if remaining_file.is_file():
                  remaining.update(line.strip() for line in remaining_file.read_text().splitlines() if line.strip())

          expected = int(os.environ.get("EXPECTED_SHARDS", "12"))
          missing = sorted(set(str(i) for i in range(expected)) - shards_seen, key=int)

          with (out / "all-errors.tsv").open("w", encoding="utf-8", newline="") as handle:
              fields = ["layer", "shard", "root", "cause", "file", "line", "col", "message"]
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter="\t", lineterminator="\n")
              writer.writeheader()
              writer.writerows({key: row.get(key, "") for key in fields} for row in error_rows)

          with (out / "all-results.tsv").open("w", encoding="utf-8", newline="") as handle:
              fields = ["layer", "shard", "status", "elapsed_seconds", "root"]
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter="\t", lineterminator="\n")
              writer.writeheader()
              writer.writerows({key: row.get(key, "") for key in fields} for row in result_rows)

          with (out / "all-bypasses.tsv").open("w", encoding="utf-8", newline="") as handle:
              fields = ["layer", "shard", "file", "declaration_line", "kind", "name", "trigger_lines", "roots"]
              writer = csv.DictWriter(handle, fieldnames=fields, delimiter="\t", lineterminator="\n")
              writer.writeheader()
              writer.writerows({key: row.get(key, "") for key in fields} for row in bypass_rows)

          (out / "remaining-roots.txt").write_text("\n".join(sorted(remaining)) + ("\n" if remaining else ""), encoding="utf-8")

          layers = sorted({int(row["layer"]) for row in result_rows})
          causes = Counter(row["cause"] for row in error_rows)
          files_by_cause: dict[str, set[str]] = defaultdict(set)
          for row in error_rows:
              files_by_cause[row["cause"]].add(row["file"])

          report = [
              "# MCFG2 deep-frontier diagnostic v10",
              "",
              f"- Shards received: **{len(shards_seen)}/{expected}**",
              f"- Parsed source diagnostics across layers: **{len(error_rows)}**",
              f"- Proof declarations bypassed in scratch trees: **{len(bypass_rows)}**",
              f"- Roots still failing at the final reached layer: **{len(remaining)}**",
              "",
              "> **Safety:** `diagnostic-scratch.patch` files contain diagnostic `sorry`",
              "> replacements. Never apply or commit them. Only `safe-autofix.patch` in",
              "> the static-audit artifact is intended as a reviewable source patch.",
              "",
          ]
          if missing:
              report.extend(["## Infrastructure warning", "", f"Missing shard artifacts: {', '.join(missing)}", ""])

          report.extend(["## Layer progression", ""])
          for layer in layers:
              rows = [row for row in result_rows if int(row["layer"]) == layer]
              passed = sum(row["status"] == "PASS" for row in rows)
              failed = sum(row["status"] == "FAIL" for row in rows)
              layer_errors = [row for row in error_rows if int(row["layer"]) == layer]
              unique_files = {row["file"] for row in layer_errors}
              report.append(
                  f"- **Layer {layer}**: checked {len(rows)} root(s), passed {passed}, failed {failed}, "
                  f"{len(layer_errors)} source diagnostic(s) in {len(unique_files)} file(s)"
              )

          report.extend(["", "## Cause clusters", ""])
          if causes:
              for cause, count in sorted(causes.items(), key=lambda item: (-item[1], item[0])):
                  report.append(f"- **{cause}**: {count} diagnostic(s), {len(files_by_cause[cause])} file(s)")
          else:
              report.append("No source-located diagnostics were parsed.")

          report.extend(["", "## Files by cause", ""])
          for cause in sorted(files_by_cause):
              report.append(f"### {cause}")
              report.append("")
              for file in sorted(files_by_cause[cause]):
                  report.append(f"- `{file}`")
              report.append("")

          report.extend(["## Scratch bypasses", ""])
          if bypass_rows:
              for row in bypass_rows[:200]:
                  report.append(
                      f"- Layer {row['layer']}, `{row['file']}:{row['declaration_line']}` — "
                      f"{row['kind']} `{row['name']}`"
                  )
              if len(bypass_rows) > 200:
                  report.append(f"- … {len(bypass_rows) - 200} additional bypass(es); see `all-bypasses.tsv`.")
          else:
              report.append("No proof declaration was eligible for conservative bypassing.")

          (out / "deep-frontier-report.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          print("\n".join(report))
          PY
          python3 ci-tools/mcfg2_deep_aggregate.py
          cat ci-artifacts/deep-combined/deep-frontier-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined deep diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcfg2-v10-deep-diagnostics-${{ github.run_number }}
          path: ci-artifacts/deep-combined
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  success-regression:
    name: Optional safe-patch regression shard ${{ matrix.shard }}
    if: ${{ inputs.run_success_regression }}
    needs:
      - prepare
      - static-audit
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Download target manifest
        uses: actions/download-artifact@v7
        with:
          name: mcfg2-v10-matrix-manifest
          path: ci-input/manifest

      - name: Download static patch
        uses: actions/download-artifact@v7
        with:
          name: mcfg2-v10-static-audit
          path: ci-input/static-audit

      - name: Recheck assigned confirmed-success roots
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
          APPLY_SAFE_AUTOFIX: ${{ inputs.apply_safe_autofix }}
        run: |
          set -euo pipefail

          out="ci-artifacts/regression-shard-${SHARD}"
          mkdir -p "$out/logs"
          : > "$out/results.tsv"

          if [[ "$APPLY_SAFE_AUTOFIX" == "true" && -s ci-input/static-audit/safe-autofix.patch ]]; then
            git apply --whitespace=nowarn ci-input/static-audit/safe-autofix.patch
          fi

          rm -rf .lake/build/lib/lean/LeanCfgProject/MCFG2
          rm -rf .lake/build/ir/LeanCfgProject/MCFG2

          python3 - "$SHARD" "$SHARD_COUNT" <<'PY' > "$out/targets.txt"
          from pathlib import Path
          import sys

          shard = int(sys.argv[1])
          count = int(sys.argv[2])
          targets = [
              line.strip()
              for line in Path("ci-input/manifest/mcfg2-confirmed-success-targets.txt")
                  .read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          for index, target in enumerate(targets):
              if index % count == shard:
                  print(target)
          PY

          while IFS= read -r target; do
            [[ -n "$target" ]] || continue
            safe="${target//./_}"
            module_path="${target//./\/}"
            rm -f \
              ".lake/build/lib/lean/${module_path}.olean" \
              ".lake/build/lib/lean/${module_path}.ilean" \
              ".lake/build/lib/lean/${module_path}.olean.hash" \
              ".lake/build/lib/lean/${module_path}.trace" \
              ".lake/build/ir/${module_path}.c" \
              ".lake/build/ir/${module_path}.o" \
              ".lake/build/ir/${module_path}.setup.json"

            started=$(date +%s)
            set +e
            lake build "$target" > "$out/logs/${safe}.log" 2>&1
            status=$?
            set -e
            elapsed=$(( $(date +%s) - started ))
            if (( status == 0 )); then
              printf 'PASS\t%s\t%s\n' "$elapsed" "$target" >> "$out/results.tsv"
            else
              printf 'FAIL\t%s\t%s\n' "$elapsed" "$target" >> "$out/results.tsv"
              echo "::error title=Successful-root regression failed::$target"
            fi
          done < "$out/targets.txt"

          failed=$(awk -F '\t' '$1 == "FAIL" {n++} END {print n+0}' "$out/results.tsv")
          passed=$(awk -F '\t' '$1 == "PASS" {n++} END {print n+0}' "$out/results.tsv")
          {
            echo "### Safe-patch regression shard ${SHARD}"
            echo
            echo "- Passed: **${passed}**"
            echo "- Failed: **${failed}**"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( failed > 0 )); then
            exit 1
          fi

      - name: Upload regression shard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcfg2-v10-regression-shard-${{ matrix.shard }}
          path: ci-artifacts/regression-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

  regression-summarize:
    name: Summarize optional 210-root regression
    if: ${{ always() && inputs.run_success_regression }}
    needs:
      - prepare
      - success-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download regression shards
        uses: actions/download-artifact@v7
        with:
          pattern: mcfg2-v10-regression-shard-*
          path: downloaded-regression
          merge-multiple: false

      - name: Combine regression results
        shell: bash
        env:
          EXPECTED_COUNT: ${{ env.MCFG2_CONFIRMED_SUCCESS_COUNT }}
          EXPECTED_SHARDS: ${{ needs.prepare.outputs.shard_count }}
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts/regression-combined
          find downloaded-regression -name results.tsv -type f -print0 \
            | sort -z \
            | xargs -0 cat > ci-artifacts/regression-combined/results.tsv

          observed=$(wc -l < ci-artifacts/regression-combined/results.tsv)
          passed=$(awk -F '\t' '$1 == "PASS" {n++} END {print n+0}' ci-artifacts/regression-combined/results.tsv)
          failed=$(awk -F '\t' '$1 == "FAIL" {n++} END {print n+0}' ci-artifacts/regression-combined/results.tsv)
          shards=$(find downloaded-regression -maxdepth 1 -type d -name 'mcfg2-v10-regression-shard-*' | wc -l)

          cat > ci-artifacts/regression-combined/summary.md <<EOF
          # Safe-patch regression summary

          - Shards: **${shards}/${EXPECTED_SHARDS}**
          - Roots observed: **${observed}/${EXPECTED_COUNT}**
          - Passed: **${passed}**
          - Failed: **${failed}**
          EOF
          cat ci-artifacts/regression-combined/summary.md >> "$GITHUB_STEP_SUMMARY"

          if (( shards != EXPECTED_SHARDS || observed != EXPECTED_COUNT || failed > 0 )); then
            exit 1
          fi

      - name: Upload combined regression summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcfg2-v10-regression-summary-${{ github.run_number }}
          path: ci-artifacts/regression-combined
          if-no-files-found: error
          retention-days: 30

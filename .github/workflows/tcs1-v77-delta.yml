name: TCS1 v77 Delta Lean

on:
  pull_request:
    branches:
      - tcs1-v68-ci-anchor5
    paths:
      - "LeanCfgProject/TCS1/**"
      - ".github/workflows/tcs1-v77-delta.yml"
      - "lakefile.toml"
      - "lean-toolchain"
      - "lake-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcs1-v77-delta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build TCS1 v77 delta facade
        uses: leanprover/lean-action@v1
        with:
          build-args: "LeanCfgProject/TCS1/V77Delta.lean:o"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-h-mcfg-prototype"
version = "0.8.0"
description = "Run-disjoint OpenTelemetry trace prototype for adaptive finite-observation MCFG selection"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptive_h_mcfg*"]

[tool.pytest.ini_options]
pythonpath = ["."]
